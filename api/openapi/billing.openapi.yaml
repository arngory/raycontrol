  /raycontrol.node.v1.NodeService/RenewUser:
    post:
      tags:
        - raycontrol.node.v1.NodeService
      summary: RenewUser
      description: |-
        RenewUser gives a user new credentials at once, as a revocation of one
         of the user's devices does (docs/decisions.md, R4-36): each a fresh
         secret with no next and no previous one, and a new LAN password when
         the user has the LAN. The user's devices are cut until they fetch
         their subscription. Since v0.27.0; an older node answers unimplemented.
      operationId: NodeService_RenewUser
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/raycontrol.node.v1.RenewUserRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/raycontrol.node.v1.RenewUserResponse'
  /raycontrol.node.v1.NodeService/RevokeDevice:
    post:
      tags:
        - raycontrol.node.v1.NodeService
      summary: RevokeDevice
      description: |-
        RevokeDevice revokes a device, or withdraws an unused invite. Revoking
         a device changes every credential of its user at once but DoH's, whose
         token is each device's (docs/spec/api-v1.md §5a): the user's other
         devices reconnect after their next subscription fetch. With overlap
         (v0.31.0, R4-43) the credentials rotate instead, as at a scheduled
         switch: the next ones published now, the switch after the lead, the
         old ones accepted for the grace after it; for a device given away or
         broken, not stolen.
      operationId: NodeService_RevokeDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/raycontrol.node.v1.RevokeDeviceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/raycontrol.node.v1.RevokeDeviceResponse'
