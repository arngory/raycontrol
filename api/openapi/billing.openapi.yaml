              $ref: '#/components/schemas/raycontrol.node.v1.SetUserTrafficRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
