syntax = "proto3";

// Perimeter feed from rayd to rayspa. Only the rayspa system user may call
// it: the snapshot carries device keys.
package raycontrol.perimeter.v1;

option go_package = "github.com/arngory/raycontrol/internal/gen/raycontrol/perimeter/v1;perimeterv1";

service PerimeterService {
  // WatchPerimeter sends the current snapshot at once and a new one after
  // every change that affects SPA access.
  rpc WatchPerimeter(WatchPerimeterRequest) returns (stream WatchPerimeterResponse);
  // ReportGuard tells rayd the state of the conntrack guard
  // (spec/conn-limit-v1.md §6.3): at each switch and once a minute.
  rpc ReportGuard(ReportGuardRequest) returns (ReportGuardResponse);
}

message ReportGuardRequest {
  Guard guard = 1;
}

message ReportGuardResponse {}

// Guard is rayspa's guard of the conntrack table: on above 85 % of
// nf_conntrack_max, off below 70 % and not before 2 minutes.
message Guard {
  bool on = 1;
  int64 since = 2;    // unix seconds: the last switch, on or off
  int64 last_on = 3;  // unix seconds: the last switch on; 0: never
  uint64 switches = 4;
  uint64 refused = 5; // new data-plane flows refused, since rayspa started
  // Entries swept for want of a socket (outbound UDP and TCP, inbound TCP).
  uint64 swept_udp = 6;
  uint64 swept_tcp_out = 7;
  uint64 swept_tcp_in = 8;
}

// RelayService is the perimeter feed of a relay in front of this node
// (relay-v1 §3.1), on the remote API: the relay proves itself with the
// client certificate the exit made for it (rayctl relay add) and calls from
// its own address. The snapshot carries the relay's SPA and its keys of the
// devices (K_relay), never the devices' own keys.
service RelayService {
  rpc WatchRelay(WatchRelayRequest) returns (stream WatchRelayResponse);
  // Report passes on a client summary report the relay took at its probe-v1
  // endpoint (relay-v1 §9.3): the relay checked RC1 with the device's
  // K_relay. The exit takes it for a device the relay knows, about the
  // client's network, never its address.
  rpc Report(ReportRequest) returns (ReportResponse);
}

message WatchRelayRequest {
  // The feed of rayd relay, the relay's probe endpoint (relay-v1 §9.1), not
  // of its rayspa: while one is open the subscription lists the endpoint.
  bool probe = 1;
}

message ReportRequest {
  string device = 1;
  // The client's network: a /24 for IPv4, a /48 for IPv6.
  string network = 2;
  // The report as the client sent it (probe-v1 §6.1), path "relay".
  bytes body = 3;
}

message ReportResponse {}

message WatchRelayResponse {
  Snapshot snapshot = 1;
}

message WatchPerimeterRequest {}

message WatchPerimeterResponse {
  Snapshot snapshot = 1;
}

message Snapshot {
  uint64 revision = 1;
  SPAParams spa = 2;
  repeated Device devices = 3;
  repeated Service services = 4;
  // Ports open to everyone, e.g. udp/53 for DNS tunnels.
  repeated Port public_ports = 5;
  // Emergency access: these prefixes reach admin_ports (SSH) without SPA.
  repeated string admin_prefixes = 6;
  repeated Port admin_ports = 7;
  // ACME window: while open, TCP 80 from any address goes to acme.port,
  // where rayd answers HTTP-01 challenges. Absent or past: closed.
  AcmeWindow acme = 8;
  // Relays (relay-v1): these single addresses reach relay_ports (the
  // services, the subscription, the API; never SSH) without SPA. Devices
  // knock at the relay, which forwards to this node.
  repeated string relay_prefixes = 9;
  repeated Port relay_ports = 10;
  // The debug window (rayctl debug): until then, unix seconds, rayspa logs
  // every SPA access and refusal. 0 or past: none.
  int64 debug_until = 11;
  // The node's egress policy (spec/egress-policy-v1.md): rayspa writes it
  // into the chain the data plane's packets pass on their way out. Absent
  // (an older rayd, a relay's feed): nothing blocked.
  Egress egress = 12;
  // The per-address limit on new inbound connections is off (rayctl
  // conn-limit off, spec/conn-limit-v1.md §8). Absent (an older rayd): on.
  bool conn_limit_off = 13;
}

// Egress is what the data plane may not send, whoever the user.
message Egress {
  bool smtp = 1;       // TCP to port 25
  bool bittorrent = 2; // the handshake, uTP SYN, UDP tracker connect, DHT queries
  // Processes it covers besides the data plane (UIDs 9100-9179): rayd's own
  // where the data plane runs as its children (rayd serve -supervise). The
  // guard of the node's own addresses does not take them: rayd reaches the
  // node itself.
  repeated uint32 uids = 3;
}

message AcmeWindow {
  uint32 port = 1;  // rayd's HTTP-01 responder
  int64 until = 2;  // unix seconds; nftables expires the window by itself
}

message SPAParams {
  bytes node_id = 1;
  uint32 epoch_len_s = 2;
  uint32 slot_len_s = 3;
  bytes port_key = 4;
  uint32 port_base = 5;
  uint32 port_range = 6;
  uint32 len_min = 7;
  uint32 len_max = 8;
  uint32 default_ttl_s = 9;
  uint32 max_ttl_s = 10;
  bool tcp_carrier = 11; // accept SPA v2 over TCP on the slot ports too
}

message Device {
  string id = 1;
  bytes key = 2;
  repeated uint32 allowed = 3; // service IDs
}

message Service {
  uint32 id = 1;
  repeated Port ports = 2;
  // UDP port rotation (spa-v2.md §11): the slot ports of this schedule are
  // redirected to target_port.
  Rotation rotation = 3;
  // Local: served by this host, never forwarded. On a relay, its own SSH
  // (relay-v1 §3.1); every other service there is forwarded to the exit.
  bool local = 4;
}

message Rotation {
  bytes port_key = 1;
  uint32 port_base = 2;
  uint32 port_range = 3;
  uint32 target_port = 4;
}

message Port {
  string proto = 1; // tcp | udp
  uint32 port = 2;
}
