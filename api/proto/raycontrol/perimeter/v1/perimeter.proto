syntax = "proto3";

// Perimeter feed from rayd to rayspa. Only the rayspa system user may call
// it: the snapshot carries device keys.
package raycontrol.perimeter.v1;

option go_package = "github.com/arngory/raycontrol/internal/gen/raycontrol/perimeter/v1;perimeterv1";

service PerimeterService {
  // WatchPerimeter sends the current snapshot at once and a new one after
  // every change that affects SPA access.
  rpc WatchPerimeter(WatchPerimeterRequest) returns (stream WatchPerimeterResponse);
  // ReportGuard tells rayd the state of the conntrack guard
  // (spec/conn-limit-v1.md §6.3): at each switch and once a minute.
  rpc ReportGuard(ReportGuardRequest) returns (ReportGuardResponse);
  // ReportGate tells rayd where rayspa's own table stands
  // (docs/decisions.md, R4-40): at each change and every 30 s. rayd
  // cannot read the kernel's table; a rayspa that follows the feed but
  // cannot put its table in leaves the host open. An older rayspa sends
  // none (rayd: unknown).
  rpc ReportGate(ReportGateRequest) returns (ReportGateResponse);
}

message ReportGateRequest {
  Gate gate = 1;
}

message ReportGateResponse {}

// Gate is rayspa's table as rayspa knows it. Never an address, nor the
// kernel's error text (which may carry one).
message Gate {
  // "up": the table in, with all of the last snapshot; "behind": the
  // table in, the last snapshot only in part; "not_in": a snapshot, but
  // its table is not in (refused, or removed and not back): the host is
  // open, or closed by a table an earlier rayspa left (left_over);
  // "no_snapshot": none yet, so no table of this rayspa's.
  string state = 1;
  // Not up, and a table an earlier rayspa left (one with its input
  // chain) is in force.
  bool left_over = 2;
  // The snapshot in force came from rayd's feed, not from the saved one.
  bool from_rayd = 3;
  string version = 4; // rayspa's
  uint32 pid = 5;
  // The feed's newest snapshot did not apply (rayspa refused it: its
  // journal says why), so an earlier one is in force: rayspa is behind
  // rayd's latest, up or not. Cleared when one of the feed's applies.
  bool refused = 6;
}

message ReportGuardRequest {
  Guard guard = 1;
}

message ReportGuardResponse {}

// Guard is rayspa's guard of the conntrack table: on above 85 % of
// nf_conntrack_max, off below 70 % and not before 2 minutes.
message Guard {
  bool on = 1;
  int64 since = 2;    // unix seconds: the last switch, on or off
  int64 last_on = 3;  // unix seconds: the last switch on; 0: never
  uint64 switches = 4;
  uint64 refused = 5; // new data-plane flows refused, since rayspa started
  // Entries swept for want of a socket (outbound UDP and TCP, inbound TCP).
  uint64 swept_udp = 6;
  uint64 swept_tcp_out = 7;
  uint64 swept_tcp_in = 8;
}

// RelayService is the perimeter feed of a relay in front of this node
// (relay-v1 §3.1), on the remote API: the relay proves itself with the
// client certificate the exit made for it (rayctl relay add) and calls from
// its own address. The snapshot carries the relay's SPA and its keys of the
// devices (K_relay), never the devices' own keys.
service RelayService {
  rpc WatchRelay(WatchRelayRequest) returns (stream WatchRelayResponse);
  // Report passes on a client summary report the relay took at its probe-v1
  // endpoint (relay-v1 §9.3): the relay checked RC1 with the device's
  // K_relay. The exit takes it for a device the relay knows, about the
  // client's network, never its address.
  rpc Report(ReportRequest) returns (ReportResponse);
  // ReportUpdate tells the exit where the relay stands with updates
  // (spec/relay-update-remote-v1.md §3.2): its version, root's switch, the
  // state of the last offer it took. A whole state each time, never a
  // delta. NotFound for anyone but the relay, as for Report;
  // ResourceExhausted for more than one call at once from the relay, or
  // more than 12 a minute; InvalidArgument for a field out of its bounds.
  // An older exit answers Unimplemented.
  rpc ReportUpdate(ReportUpdateRequest) returns (ReportUpdateResponse);
}

message WatchRelayRequest {
  // The feed of rayd relay, the relay's probe endpoint (relay-v1 §9.1), not
  // of its rayspa: while one is open the subscription lists the endpoint.
  bool probe = 1;
  // The feed takes the exit's update offers
  // (spec/relay-update-remote-v1.md §3.2): a rayd relay that knows them
  // sets it, whatever the relay's policy. rayspa's feed and an older rayd
  // relay's get none.
  bool updates = 2;
  // The SPA versions the relay's rayspa takes (spec/spa-v3.md §5): with 3
  // the exit lists the relay's SPA with versions [2, 3]. rayd relay's feed
  // and an older rayspa's send none.
  repeated uint32 spa_versions = 3;
  // The relay's rayspa forwards TCP 80 to the exit while the snapshot's
  // acme_forward_until is ahead (spec/relay-names-v1.md §6): only then
  // does an exit without a DNS provider order the relay's names under
  // HTTP-01, whose challenges come to the relay's address. rayd relay's
  // feed and an older rayspa's do not set it.
  bool acme_forward = 4;
}

message ReportRequest {
  string device = 1;
  // The client's network: a /24 for IPv4, a /48 for IPv6.
  string network = 2;
  // The report as the client sent it (probe-v1 §6.1), path "relay".
  bytes body = 3;
}

message ReportResponse {}

message WatchRelayResponse {
  Snapshot snapshot = 1;
  // The release the exit asks this relay to update to, in a feed with
  // updates only. Absent: nothing asked (an older exit, no update by
  // request, or not this relay's turn).
  RelayUpdateOffer update = 2;
}

// RelayUpdateOffer names the release the exit runs after an update of its
// own (spec/relay-update-remote-v1.md §3.3). The relay takes it only if
// root on the relay allows it (rayctl update remote on) and only forward;
// it downloads and verifies the release itself.
message RelayUpdateOffer {
  string id = 1;      // the node's update it follows (node.v1 UpdateStatus.id): 1-32 hex
  string version = 2; // vX.Y.Z: the release the exit runs, which that update installed
  int64 ended_at = 3; // unix seconds, the exit's clock: when that update ended
}

message ReportUpdateRequest {
  // At most 1 KiB, the whole request.
  RelayUpdate update = 1;
}

message ReportUpdateResponse {}

// RelayUpdate is where a relay stands with updates by the exit's word
// (spec/relay-update-remote-v1.md §3.4, §3.6). The exit trusts none of it:
// it checks the bounds and cleans error again.
message RelayUpdate {
  string version = 1;  // the relay's release now (rayd relay's own version): "" or vX.Y.Z, at most 40 bytes
  bool remote = 2;     // root on the relay takes the exit's offers (rayctl update remote on)
  // idle (no offer taken yet), requested (the request written, root has
  // not taken it), running, done (on target, checked), rolled_back (the
  // previous relay runs again, checked; target held), failed (refused
  // before any change, the host left open, cut short, or not taken).
  string state = 3;
  string id = 4;       // the offer the state is about: 1-32 hex; "" with idle
  string target = 5;   // the version that offer named: "" or vX.Y.Z, at most 40 bytes
  // A code, "" when none: policy, stale, version, busy, unfinished,
  // bundle, ssh, download, signature, place (all before any change);
  // install, check, interrupted, open (after); not_taken (rayd relay: the
  // request not taken within an hour).
  string reason = 6;
  string error = 7;    // short printable text, redacted on the relay (no addresses, no keys), at most 200 bytes
  int64 at = 8;        // unix seconds, the relay's clock: when the state was reached
  bool unfinished = 9; // an update of the relay did not end: root on the relay must act
}

message WatchPerimeterRequest {}

message WatchPerimeterResponse {
  Snapshot snapshot = 1;
}

message Snapshot {
  uint64 revision = 1;
  SPAParams spa = 2;
  repeated Device devices = 3;
  repeated Service services = 4;
  // Ports open to everyone, e.g. udp/53 for DNS tunnels.
  repeated Port public_ports = 5;
  // Emergency access: these prefixes reach admin_ports (SSH) without SPA.
  repeated string admin_prefixes = 6;
  repeated Port admin_ports = 7;
  // ACME window: while open, TCP 80 from any address goes to acme.port,
  // where rayd answers HTTP-01 challenges. Absent or past: closed.
  AcmeWindow acme = 8;
  // Relays (relay-v1): these single addresses reach relay_ports (the
  // services, the subscription, the API; never SSH) without SPA. Devices
  // knock at the relay, which forwards to this node.
  repeated string relay_prefixes = 9;
  repeated Port relay_ports = 10;
  // The debug window (rayctl debug): until then, unix seconds, rayspa logs
  // every SPA access and refusal. 0 or past: none.
  int64 debug_until = 11;
  // The node's egress policy (spec/egress-policy-v1.md): rayspa writes it
  // into the chain the data plane's packets pass on their way out. Absent
  // (an older rayd, a relay's feed): nothing blocked.
  Egress egress = 12;
  // The per-address limit on new inbound connections is off (rayctl
  // conn-limit off, spec/conn-limit-v1.md §8). Absent (an older rayd): on.
  bool conn_limit_off = 13;
  // Integrations' servers (integrations-v1 §3.2): these prefixes reach
  // integ_ports (the API's TCP port only) without SPA, under the
  // per-address limit. Absent (an older rayd): none.
  repeated string integ_prefixes = 14;
  repeated Port integ_ports = 15;
  // The node's public addresses (a relay's: its own), IPv4 and IPv6, at
  // most 16: a SPA v3 packet that names one of these, or the address it
  // came to, is the node's (spec/spa-v3.md §4). Absent (an older rayd):
  // only the address it came to.
  repeated string own_addrs = 16;
  // A relay's snapshot only (spec/relay-names-v1.md §6): until then, unix
  // seconds, the relay forwards TCP 80 from any address to the exit's port
  // 80, without a grant, for the exit's ACME window of an order with the
  // relay's names. Not Snapshot.acme, which points TCP 80 to a port of
  // the host itself. 0 or past (an older exit): nothing forwarded.
  int64 acme_forward_until = 17;
}

// Egress is what the data plane may not send, whoever the user.
message Egress {
  bool smtp = 1;       // TCP to port 25
  bool bittorrent = 2; // the handshake, uTP SYN, UDP tracker connect, DHT queries
  // Processes it covers besides the data plane (UIDs 9100-9179): rayd's own
  // where the data plane runs as its children (rayd serve -supervise). The
  // guard of the node's own addresses does not take them: rayd reaches the
  // node itself.
  repeated uint32 uids = 3;
  // The node's own and local networks (docs/decisions.md, R4-38):
  // loopback, private, link-local, CGNAT, multicast, the metadata address.
  // Absent (an older rayd): rayspa does not hold them back, as before.
  Local local = 4;
}

// Local is the egress policy's part for the node's own and local networks.
message Local {
  // The data plane may reach them (rayctl egress allow local); false, the
  // default: refused, but for systemd-resolved's stub on port 53 and the
  // ports below.
  bool allow = 1;
  // Ports on 127.0.0.1 the data plane reaches all the same: the channel
  // probe's endpoint (the subscription's port, spec/probe-v1.md).
  repeated Port loopback = 2;
  // Exact destinations one process of the data plane reaches all the
  // same: a REALITY target the operator set on a local address (the
  // host's own web server on 127.0.0.1:8443, a server on the private
  // network), from that REALITY service's process only. Absent (an older
  // rayd): none.
  repeated LocalExempt exempt = 3;
}

// LocalExempt is one destination the local part lets through, by its
// exact address, protocol and port, for one UID.
message LocalExempt {
  string addr = 1; // one IP address
  Port port = 2;
  uint32 uid = 3;  // the service's process (9110-9179)
}

message AcmeWindow {
  uint32 port = 1;  // rayd's HTTP-01 responder
  int64 until = 2;  // unix seconds; nftables expires the window by itself
}

message SPAParams {
  bytes node_id = 1;
  uint32 epoch_len_s = 2;
  uint32 slot_len_s = 3;
  bytes port_key = 4;
  uint32 port_base = 5;
  uint32 port_range = 6;
  uint32 len_min = 7;
  uint32 len_max = 8;
  uint32 default_ttl_s = 9;
  uint32 max_ttl_s = 10;
  bool tcp_carrier = 11; // accept SPA v2 over TCP on the slot ports too
}

message Device {
  string id = 1;
  bytes key = 2;
  repeated uint32 allowed = 3; // service IDs
}

message Service {
  uint32 id = 1;
  repeated Port ports = 2;
  // UDP port rotation (spa-v2.md §11): the slot ports of this schedule are
  // redirected to target_port.
  Rotation rotation = 3;
  // Local: served by this host, never forwarded. On a relay, its own SSH
  // (relay-v1 §3.1); every other service there is forwarded to the exit.
  bool local = 4;
}

message Rotation {
  bytes port_key = 1;
  uint32 port_base = 2;
  uint32 port_range = 3;
  uint32 target_port = 4;
}

message Port {
  string proto = 1; // tcp | udp
  uint32 port = 2;
}
