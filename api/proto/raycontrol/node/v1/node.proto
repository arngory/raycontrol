syntax = "proto3";

// Node API of raycontrol: on the local unix socket for rayctl, and on the
// remote API behind SPA and mTLS for admin devices (R3-3,
// docs/spec/api-v1.md).
// Compatibility follows protobuf rules; breaking changes go to node.v2.
package raycontrol.node.v1;

option go_package = "github.com/arngory/raycontrol/internal/gen/raycontrol/node/v1;nodev1";

service NodeService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc SetUserEnabled(SetUserEnabledRequest) returns (SetUserEnabledResponse);
  rpc SetUserServices(SetUserServicesRequest) returns (SetUserServicesResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // ExportUser returns a user's profiles: the links of their subscription
  // (docs/spec/subscription-v1.md §4), each with the next one while a
  // switch is pending (P-10). They hold the user's credentials, so the
  // call is audited. They work only from an address SPA has opened.
  rpc ExportUser(ExportUserRequest) returns (ExportUserResponse);

  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
  rpc SetServiceEnabled(SetServiceEnabledRequest) returns (SetServiceEnabledResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  // RotateService asks for the next key switch of a REALITY service
  // (docs/08-decisions.md, R4-7): a lead time away, so that clients get the
  // next keys first, or at once (leaked keys, a blocked name). For a dnstt
  // service it switches the seal key at once (spec/dnsseal-v1.md §8): the
  // previous one stays accepted for the credential grace, unless now.
  rpc RotateService(RotateServiceRequest) returns (RotateServiceResponse);
  // SetServiceOption changes one of the few settings that may change after
  // creation: a site's answer, whether REALITY moves its server name,
  // Hysteria2's Brutal ceilings, Yggdrasil's public peers.
  rpc SetServiceOption(SetServiceOptionRequest) returns (SetServiceOptionResponse);
  // SetCertificate puts the operator's own certificate on a site, in place
  // of one from ACME, for every service under it (REALITY self-steal,
  // hy2-masq, naive, DoH, Yggdrasil). With ACME on, rayd renews it when it
  // is due. On the node only: it carries the private key.
  rpc SetCertificate(SetCertificateRequest) returns (SetCertificateResponse);

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // CreateDevice returns the device bundle with the device key. The key is
  // not stored anywhere it can be read back through the API.
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  // RevokeDevice revokes a device, or withdraws an unused invite.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // CreateInvite returns a one-time invite ("rcinv1:..."): the client
  // registers the device itself through the remote API (R3-3).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // Admin access: addresses (CIDR) that reach SSH without SPA (emergency
  // access, docs/08-decisions.md D-6).
  rpc GetAdminAccess(GetAdminAccessRequest) returns (GetAdminAccessResponse);
  rpc SetAdminAccess(SetAdminAccessRequest) returns (SetAdminAccessResponse);

  // Relays in front of the node (relay-v1): one address each, which
  // reaches the service ports without SPA. Adding and removing is for
  // root on the node only: a relay opens the perimeter.
  rpc AddRelay(AddRelayRequest) returns (AddRelayResponse);
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse);
  rpc RemoveRelay(RemoveRelayRequest) returns (RemoveRelayResponse);
  // IssueRelayBundle makes the relay a new client certificate (the one
  // before stops working) and returns what its host needs (relay-v1 §3).
  // It holds the relay's private key: root on the node only.
  rpc IssueRelayBundle(IssueRelayBundleRequest) returns (IssueRelayBundleResponse);
  // SetRelayAccess changes the relay host's SSH port and admin addresses
  // without a new bundle: its SPA and certificate stay.
  rpc SetRelayAccess(SetRelayAccessRequest) returns (SetRelayAccessResponse);

  // The DNS provider (Cloudflare): the node's records in its zone and
  // certificates through DNS-01 with a wildcard name (R4-10). The token is
  // stored by rayd and never returned.
  rpc SetDNSProvider(SetDNSProviderRequest) returns (SetDNSProviderResponse);
  rpc GetDNS(GetDNSRequest) returns (GetDNSResponse);
  rpc SyncDNS(SyncDNSRequest) returns (SyncDNSResponse);
  rpc RemoveDNS(RemoveDNSRequest) returns (RemoveDNSResponse);
  // CheckDNSZones checks the DNS tunnel zones from the node: the
  // delegation at the parent's own servers, the front and the backend on
  // the node, and each zone through public resolvers with dnsprobe-v1
  // (docs/09-observability.md). Without now it returns the last periodic
  // check (rayd -dns-check). now checks at once, at most once per 30 s:
  // a call within that gets the last check (limited), calls at the same
  // time share one. The answer holds no secret.
  rpc CheckDNSZones(CheckDNSZonesRequest) returns (CheckDNSZonesResponse);

  // Backup returns a consistent copy of the node's database. Root only: it
  // holds every key (R4-13); rayctl encrypts it with the operator's
  // passphrase, which never reaches rayd.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // GetMetrics returns aggregate metrics in the Prometheus text format, no
  // names of users, devices or services (R4-14).
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

  // GetSummary returns the state of the client summaries (R4-21): whether
  // the node takes reports, the AS lookup, and the networks with at least
  // k reports; smaller groups only as a total.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  // SetSummary turns the reports on or off, and the online AS lookup. The
  // token is stored by rayd and never returned.
  rpc SetSummary(SetSummaryRequest) returns (SetSummaryResponse);
  // SetDebug opens the debug window for a while or closes it: rayd, rayspa
  // and niko-server log at debug level until it ends by itself
  // (docs/09-observability.md §3). Root on the node only.
  rpc SetDebug(SetDebugRequest) returns (SetDebugResponse);

  // GetDeployment returns what root must install for the current services:
  // system users, unit files and other files. rayctl apply writes them.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
}

message SetDNSProviderRequest {
  string provider = 1; // cloudflare
  string token = 2;    // API token: Zone.DNS:Edit and Zone.Zone:Read on the node's zone
}
message SetDNSProviderResponse { DNSStatus status = 1; }

message GetDNSRequest {}
message GetDNSResponse { DNSStatus status = 1; }

message SyncDNSRequest {}
message SyncDNSResponse { DNSStatus status = 1; }

message RemoveDNSRequest {
  bool keep_records = 1; // forget the provider but leave the records in the zone
}
message RemoveDNSResponse { repeated string removed = 1; }

message DNSStatus {
  string provider = 1; // "" when the node has none
  string zone = 2;
  repeated DNSRecord records = 3; // what the node needs in the zone
  repeated string changes = 4;    // what a sync changed
  repeated string problems = 5;   // conflicts, records that cannot be made
}

message DNSRecord {
  string type = 1;
  string name = 2;
  string content = 3;
}

message CheckDNSZonesRequest {
  bool now = 1; // check now instead of returning the last periodic check
  // Ask these resolvers instead of rayd's (-dns-check-resolvers), now:
  // google, cloudflare, quad9, nsdi, msk-ix, yandex, system, udp:IP or
  // tcp:IP. The Russian ones and system only warn.
  repeated string resolvers = 2;
}
message CheckDNSZonesResponse {
  int64 checked_at = 1; // unix seconds; 0: no check yet
  int64 next_at = 2;    // the next periodic check, unix seconds; 0: none
  bool limited = 3;     // now came within 30 s of the last check: this is that one
  repeated string resolvers = 4; // those asked, as "google 8.8.8.8"
  repeated DNSZoneCheck zones = 5;
  uint32 duration_ms = 6;
}

// DNSZoneCheck is one zone's check.
message DNSZoneCheck {
  string service = 1;
  string kind = 2;    // dnstt | masterdns
  string zone = 3;
  string ns = 4;      // the name the parent should delegate it to; "" when the delegation is the operator's own
  string state = 5;   // ok | warn | fail
  string summary = 6;
  string error = 7;   // why the zone fails; "" when it does not
  bool delegated = 8; // the parent delegates it to the node: resolvers were asked
  DNSCheckStep parent = 9;
  DNSCheckStep front = 10;
  DNSCheckStep backend = 11;
  repeated DNSResolverCheck resolvers = 12;
}

// DNSCheckStep is one step of a zone's check.
message DNSCheckStep {
  string state = 1; // ok | warn | fail | skip
  string detail = 2;
  string fix = 3;
  uint32 rtt_ms = 4;
}

// DNSResolverCheck is a zone through one resolver.
message DNSResolverCheck {
  string resolver = 1;    // "google 8.8.8.8", "udp:192.0.2.9"
  string network = 2;     // udp | tcp
  bool warn_only = 3;     // its failures only warn
  DNSCheckStep soa = 4;   // the apex (dnstt with an NS name); it may come from its cache
  DNSCheckStep small = 5; // the small probe (dnstt); an answer to a random name (masterdns)
  DNSCheckStep large = 6; // the large probe (dnstt)
  uint32 edns = 7;        // the UDP size it advertised to the node; 0: none, or not seen
  bool case_randomized = 8; // 0x20 seen by the node
  string egress = 9;      // its address as the node saw it
}

message BackupRequest {}
message BackupResponse {
  bytes database = 1;
  string node_id = 2;
  string version = 3;
  int64 created_at = 4;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  string text = 1;
}

message GetAdminAccessRequest {}
message GetAdminAccessResponse { repeated string cidrs = 1; }

message SetAdminAccessRequest { repeated string cidrs = 1; }
message SetAdminAccessResponse {}

message Relay {
  string name = 1;
  string address = 2;
  int64 created_at = 3;
  uint32 probe_port = 4; // its probe endpoint, TCP and UDP (relay-v1 §9.1); 0: none
}
message AddRelayRequest {
  string name = 1;
  string address = 2;  // one public IP
}
message AddRelayResponse { Relay relay = 1; }
message ListRelaysRequest {}
message ListRelaysResponse { repeated Relay relays = 1; }
message RemoveRelayRequest { string name = 1; }
message RemoveRelayResponse {}
message IssueRelayBundleRequest {
  string name = 1;
  string exit_address = 2;  // the exit's IP; empty: the node's host if it is one
  uint32 ssh_port = 3;      // the relay host's SSH; 0 keeps it (22 at first)
  // Addresses that reach the relay host's SSH without SPA (its own, never
  // the exit's list); empty keeps them; a relay needs some. Devices allowed
  // the exit's SSH may also open it by SPA with their K_relay.
  repeated string admin = 4;
  // Used when admin is empty and the relay has no list yet: rayctl's
  // default, the address of the SSH session it runs in.
  repeated string admin_if_none = 5;
}
message IssueRelayBundleResponse {
  string bundle = 1;
  uint32 ssh_port = 2;       // the relay host's SSH port now
  repeated string admin = 3; // and its admin addresses
  bool admin_kept = 4;       // the relay's list from before, none asked for
  uint32 probe_port = 5;     // its probe endpoint, TCP and UDP (relay-v1 §9.1)
}
message SetRelayAccessRequest {
  string name = 1;
  uint32 ssh_port = 2;       // 0 keeps it
  repeated string admin = 3; // empty keeps them
}
message SetRelayAccessResponse {}

message GetDeploymentRequest {}
message GetDeploymentResponse {
  repeated SystemUser users = 1;
  repeated DeployFile files = 2;
  repeated string units = 3;     // units to enable and keep running
  repeated string warnings = 4;
  // Ports clients reach; host firewalls (firewalld, ufw) must let them through.
  repeated PortRange host_ports = 5;
  // The same ports as they arrive from outside, before the node's own
  // redirects (the ACME window is TCP 80 there): what a provider's firewall
  // in front of the host must let in.
  repeated PortRange outside_ports = 6;
  // The front answers DNS tunnels on UDP 53 (beside systemd-resolved's stub).
  bool front_dns = 7;
}

message PortRange {
  string proto = 1; // tcp | udp
  uint32 from = 2;
  uint32 to = 3;    // inclusive
}

message SystemUser {
  string name = 1;
  uint32 uid = 2;
  repeated string extra_groups = 3; // groups the user joins
}

message DeployFile {
  string path = 1;
  uint32 mode = 2;
  bytes content = 3;
}

message GetStatusRequest {}
message GetStatusResponse {
  string version = 1;
  string node_id = 2;
  string host = 3;
  uint32 users = 4;
  uint32 services = 5;
  uint32 active_devices = 6;
  // SPA ports open right now (previous, current and next slot).
  repeated uint32 spa_ports = 7;
  // rayd's loops: when each last succeeded and failed (O-2).
  repeated LoopHealth loops = 8;
  // The end of the debug window (rayctl debug), unix seconds; 0: none.
  int64 debug_until = 9;
}

message LoopHealth {
  string name = 1;     // apply, acme <site>, dns, reality-rotation, ...
  int64 last_ok = 2;   // unix seconds, 0 = never
  int64 last_error = 3; // unix seconds, 0 = never
  string error = 4;    // the last error
  uint64 runs = 5;
  uint64 errors = 6;
  bool failing = 7;    // the last round failed (rayd after v0.10.0)
  string detail = 8;   // what the last round found (dns-zone <service>: the zone's summary)
}

message User {
  int64 id = 1;
  string name = 2;
  bool enabled = 3;
  int64 expires_at = 4;          // unix seconds, 0 = never
  int64 traffic_limit_bytes = 5; // 0 = unlimited
  string note = 6;
  int64 created_at = 7;
  repeated string services = 8;  // service names
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  string name = 1;
  int64 expires_at = 2;
  int64 traffic_limit_bytes = 3;
  string note = 4;
  repeated string services = 5;
}
message CreateUserResponse { User user = 1; }

message SetUserEnabledRequest {
  string name = 1;
  bool enabled = 2;
}
message SetUserEnabledResponse {}

message SetUserServicesRequest {
  string name = 1;
  repeated string services = 2;
}
message SetUserServicesResponse {}

message DeleteUserRequest { string name = 1; }
message DeleteUserResponse {}

message ExportUserRequest { string name = 1; }
message ExportUserResponse {
  repeated Profile profiles = 1;
}
// Profile is one profile of the subscription.
message Profile {
  uint32 service_id = 1;
  string service = 2;
  string link = 3;
  // next_link replaces link from next_from (unix seconds) on; empty when
  // nothing is pending.
  string next_link = 4;
  int64 next_from = 5;
}

message Service {
  uint32 id = 1; // also the SPA scope ID
  string kind = 2;
  string name = 3;
  bool enabled = 4;
  string settings_json = 5;
  int64 created_at = 6;
  uint32 uid = 7; // system user of the service's process, 0 if none
}

message ListServicesRequest {}
message ListServicesResponse {
  repeated Service services = 1;
  repeated string kinds = 2; // kinds this node can run
}

message CreateServiceRequest {
  string kind = 1;
  string name = 2;
  string settings_json = 3;
}
message CreateServiceResponse { Service service = 1; }

message SetServiceEnabledRequest {
  string name = 1;
  bool enabled = 2;
}
message SetServiceEnabledResponse {}

message DeleteServiceRequest { string name = 1; }
message DeleteServiceResponse {}

message SetServiceOptionRequest {
  string name = 1;
  string key = 2;
  string value = 3;
}
message SetServiceOptionResponse {
  Service service = 1;
}

message SetCertificateRequest {
  string service = 1; // a site
  bytes chain_pem = 2; // leaf first
  bytes key_pem = 3;
}
message SetCertificateResponse {
  repeated string names = 1; // the site's names in use, all covered
  int64 not_after = 2; // unix seconds
  // Names REALITY moves to at its next key switch that the certificate
  // does not cover: the switch waits for a certificate that does.
  repeated string missing_next = 3;
}

message RotateServiceRequest {
  string name = 1;
  bool now = 2;
}
message RotateServiceResponse {
  int64 switch_at = 1; // unix seconds; later if a new server name waits for its certificate
  bool seal = 2; // a dnstt service: its seal key switched at switch_at
  int64 prev_until = 3; // the previous seal key is accepted until then (unix seconds); 0: no longer
}

message Device {
  string id = 1;
  string user = 2;
  string name = 3;
  string role = 4; // user | admin
  int64 created_at = 5;
  int64 revoked_at = 6; // 0 = active
  bool registered = 7; // through the remote API, with a client certificate
}

// Invite is an invite not yet used.
message Invite {
  string id = 1;
  string user = 2;
  string name = 3; // of the device it becomes
  string role = 4;
  int64 created_at = 5;
  int64 expires_at = 6;
  // pin_tries: the invite needs a PIN, with this many wrong ones left; 0:
  // no PIN.
  int32 pin_tries = 7;
}

message ListDevicesRequest { string user = 1; }
message ListDevicesResponse {
  repeated Device devices = 1;
  repeated Invite invites = 2;
}

message CreateDeviceRequest {
  string user = 1;
  string name = 2;
  string role = 3;
}
message CreateDeviceResponse {
  Device device = 1;
  string bundle = 2; // "rcdev1:..." (docs/spec/spa-v2.md)
}

message RevokeDeviceRequest { string id = 1; }
message RevokeDeviceResponse {}

message CreateInviteRequest {
  string user = 1;
  string name = 2; // of the device
  string role = 3; // user | admin
  int64 ttl_seconds = 4; // 0: a day; at most a week
  // pin: the invite also needs a PIN of 6 digits, told by another channel
  // (docs/spec/api-v1.md §3).
  bool pin = 5;
}
message CreateInviteResponse {
  Invite invite = 1;
  string invite_code = 2; // "rcinv1:..." (docs/spec/api-v1.md)
  string pin = 3; // the PIN, shown once; "" without
  string invite_code_short = 4; // the same invite as "RCINV2:..." (api-v1 §3a); "" if the host cannot go in it
}

message AuditEntry {
  int64 time = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string result = 5;
}

message ListAuditRequest { uint32 limit = 1; }
message ListAuditResponse { repeated AuditEntry entries = 1; }

message GetSummaryRequest {
  // days counted: 1 to 30, 7 when 0.
  uint32 days = 1;
}
message GetSummaryResponse {
  bool enabled = 1;
  // api is the online lookup turned on ("ipinfo"), or empty.
  string api = 2;
  // dbs are the AS databases in lookup order.
  repeated SummaryDB dbs = 3;
  repeated SummaryNetwork networks = 4;
  // other_reports come from networks with fewer than k reports.
  int64 other_reports = 5;
  uint32 days = 6;
  uint32 k = 7;
}
message SummaryDB {
  string role = 1; // operator | release
  string path = 2;
  bool present = 3;
  int64 built = 4; // unix seconds, from the file's metadata
  string type = 5;
}
message SummaryNetwork {
  uint32 asn = 1;
  string name = 2;
  string country = 3;
  int64 reports = 4;
  map<string, int64> nets = 5;
  repeated SummaryService services = 6;
  map<string, int64> udp_mtu = 7; // reports by UDP MTU bucket
}
message SummaryService {
  uint32 id = 1;
  string name = 2;
  map<string, int64> results = 3;
  map<string, int64> udp = 4;
  map<string, int64> mbps = 5;
  map<string, int64> stall_kib = 6;
  // DNS tunnels: working observations by resolver kind (probe-v1 §6.1).
  map<string, int64> dns = 7;
  // dnstt: working observations by zone, "0" the main one, "1" to "4" its
  // spares in the links' order (probe-v1 §6, dnszones-v1 §3).
  map<string, int64> zone = 8;
}
message SetSummaryRequest {
  // enabled: "on" or "off"; empty leaves it.
  string enabled = 1;
  // api: "ipinfo" with a token turns the lookup on, "none" turns it off;
  // empty leaves it.
  string api = 2;
  string token = 3;
}
message SetSummaryResponse {}
message SetDebugRequest {
  // seconds: how long the window stays open, up to a day; 0 closes it.
  int64 seconds = 1;
}
message SetDebugResponse {
  int64 until = 1; // unix seconds; 0: closed
}
