syntax = "proto3";

// Node API of raycontrol: on the local unix socket for rayctl, and on the
// remote API behind SPA and mTLS for admin devices (R3-3,
// docs/spec/api-v1.md) and integrations (docs/spec/integrations-v1.md).
// Compatibility follows protobuf rules; breaking changes go to node.v2.
//
// Who calls what through the remote API: each method's
// google.api.method_visibility names the device roles, ADMIN, BILLING,
// SUPPORT, or NODE (root on the node's socket only, never remote); rayd
// builds its table from them, and a method without one is ADMIN's. A
// field whose google.api.field_visibility leaves out a role is cleared in
// that role's answers; NOTES is support's sight of a user's note, which
// the administrator allows (integrations-v1 §2.2, §5.1).
package raycontrol.node.v1;

import "google/api/visibility.proto";

option go_package = "github.com/arngory/raycontrol/internal/gen/raycontrol/node/v1;nodev1";

service NodeService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING,SUPPORT";
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING,SUPPORT";
  }
  // GetUser is one user of ListUsers (integrations-v1 §10).
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING,SUPPORT";
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  rpc SetUserEnabled(SetUserEnabledRequest) returns (SetUserEnabledResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  rpc SetUserServices(SetUserServicesRequest) returns (SetUserServicesResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  // SetUserExpiry sets when the user expires: later, never (0), or now
  // (a time not after now). The time is absolute, so a repeated call
  // leaves the same state (integrations-v1 §5.2).
  rpc SetUserExpiry(SetUserExpiryRequest) returns (SetUserExpiryResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  // SetUserTraffic sets or removes a user's traffic limit, its period and
  // reset day, or zeroes the current period's count
  // (docs/spec/traffic-limit-v1.md §3.6). A user at or over the limit is
  // taken off every profile, as an expired one, until the period resets
  // or the limit is raised. A request that changes nothing is invalid.
  rpc SetUserTraffic(SetUserTrafficRequest) returns (SetUserTrafficResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  // SetUserLAN gives or takes back the administrator's consent to a user's
  // LAN (docs/spec/lan-v1.md §1.1): the user's devices see each other over
  // Yggdrasil, each that shows itself (X-Raycontrol-LAN in its subscription
  // request). On needs a Yggdrasil service of the user's, and gives the
  // user a new multicast password every time.
  rpc SetUserLAN(SetUserLANRequest) returns (SetUserLANResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // ExportUser returns a user's profiles: the links of their subscription
  // (docs/spec/subscription-v1.md §4), each with the next one while a
  // switch is pending (P-10). They hold the user's credentials, so the
  // call is audited. They work only from an address SPA has opened.
  rpc ExportUser(ExportUserRequest) returns (ExportUserResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // RenewUser gives a user new credentials at once, as a revocation of one
  // of the user's devices does (docs/decisions.md, R4-36): each a fresh
  // secret with no next and no previous one, and a new LAN password when
  // the user has the LAN. The user's devices are cut until they fetch
  // their subscription. Since v0.27.0; an older node answers unimplemented.
  rpc RenewUser(RenewUserRequest) returns (RenewUserResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }

  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING,SUPPORT";
  }
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc SetServiceEnabled(SetServiceEnabledRequest) returns (SetServiceEnabledResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // RotateService asks for the next key switch of a REALITY service
  // (docs/decisions.md, R4-7): a lead time away, so that clients get the
  // next keys first, or at once (leaked keys, a blocked name). For a dnstt
  // service it switches the seal key at once (spec/dnsseal-v1.md §8), for
  // a masterdns one its service key (spec/masterdns-key-rotation.md §2):
  // the previous one stays accepted for the credential grace, unless now.
  // For a site it asks for another key of its certificate
  // (spec/cert-pin-v1.md §5): rayd orders a certificate with it, one try at
  // once and then by its back-off, and switches when it is stored. Root on
  // the node only. To the next key: failed_precondition unless that key has
  // been in subscriptions for the lead, or force. To a key made for the
  // order, with a new next key: fresh. For a naive service it asks for a
  // switch of its server name (R4-42, raycontrol v0.29.0): a lead time
  // away, or at once with now to the next name the front already routes;
  // the previous name stays accepted until the switch after, now or not.
  rpc RotateService(RotateServiceRequest) returns (RotateServiceResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetServiceOption changes one of the few settings that may change after
  // creation: a site's answer, whether REALITY moves its server name,
  // Hysteria2's Brutal ceilings, Yggdrasil's public peers and its ceiling
  // of LAN traffic through the node (lan_relay, docs/spec/lan-v1.md §4.4).
  rpc SetServiceOption(SetServiceOptionRequest) returns (SetServiceOptionResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // GetYggdrasilPeerKeys returns the public keys a Yggdrasil service lets
  // in, for a peer of the operator's own (yggdrasil-go's
  // AllowedPublicKeys, rayctl service peer-keys): the node's key in the
  // mesh, which peers with it, then each active user's own key and each
  // of the user's devices not revoked, for every inner UUID the node takes
  // now (its backend's users file): these change with the devices, the
  // users and every credential switch. Public keys only, each with its
  // label in that file; the users' and devices' names only when asked
  // (names). Who may list the devices may ask. Since v0.31.0; an older
  // node answers unimplemented.
  rpc GetYggdrasilPeerKeys(GetYggdrasilPeerKeysRequest) returns (GetYggdrasilPeerKeysResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetCertificate puts the operator's own certificate on a site, in place
  // of one from ACME, for every service under it (REALITY self-steal,
  // hy2-masq, naive, DoH, Yggdrasil). With ACME on, rayd renews it when it
  // is due. Root on the node only: it carries the private key, and it
  // replaces the key clients pin. While it is on the site, the lines of
  // naive, hy2-masq and DoH carry no niko-pin (spec/cert-pin-v1.md §7).
  rpc SetCertificate(SetCertificateRequest) returns (SetCertificateResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING,SUPPORT";
  }
  // CreateDevice returns the device bundle with the device key. The key is
  // not stored anywhere it can be read back through the API.
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // RevokeDevice revokes a device, or withdraws an unused invite. Revoking
  // a device changes every credential of its user at once but DoH's, whose
  // token is each device's (docs/spec/api-v1.md §5a): the user's other
  // devices reconnect after their next subscription fetch. With overlap
  // (v0.31.0, R4-43) the credentials rotate instead, as at a scheduled
  // switch: the next ones published now, the switch after the lead, the
  // old ones accepted for the grace after it; for a device given away or
  // broken, not stolen.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  // CreateInvite returns a one-time invite ("rcinv1:..."): the client
  // registers the device itself through the remote API (R3-3).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,BILLING";
  }
  // SetDeviceAllow gives an integration's device (billing, support) the
  // addresses it calls from, which reach the API without a knock
  // (integrations-v1 §3.2), or takes them away: the device knocks again.
  rpc SetDeviceAllow(SetDeviceAllowRequest) returns (SetDeviceAllowResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }

  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }

  // Admin access: addresses (CIDR) that reach SSH without SPA (emergency
  // access, docs/decisions.md D-6).
  rpc GetAdminAccess(GetAdminAccessRequest) returns (GetAdminAccessResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc SetAdminAccess(SetAdminAccessRequest) returns (SetAdminAccessResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }

  // Relays in front of the node (relay-v1): one address each, which
  // reaches the service ports without SPA. Adding and removing is for
  // root on the node only: a relay opens the perimeter. ListRelays gives
  // each relay's ports too (Relay.ports), for its host's firewall.
  rpc AddRelay(AddRelayRequest) returns (AddRelayResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc RemoveRelay(RemoveRelayRequest) returns (RemoveRelayResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // IssueRelayBundle makes the relay a new client certificate (the one
  // before stops working) and returns what its host needs (relay-v1 §3).
  // It holds the relay's private key: root on the node only.
  rpc IssueRelayBundle(IssueRelayBundleRequest) returns (IssueRelayBundleResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // SetRelayAccess changes the relay host's SSH port and admin addresses
  // without a new bundle: its SPA and certificate stay.
  rpc SetRelayAccess(SetRelayAccessRequest) returns (SetRelayAccessResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }

  // The DNS provider (Cloudflare): the node's records in its zone and
  // certificates through DNS-01 with a wildcard name (R4-10). The token is
  // stored by rayd and never returned.
  rpc SetDNSProvider(SetDNSProviderRequest) returns (SetDNSProviderResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc GetDNS(GetDNSRequest) returns (GetDNSResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc SyncDNS(SyncDNSRequest) returns (SyncDNSResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc RemoveDNS(RemoveDNSRequest) returns (RemoveDNSResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // CheckDNSZones checks the DNS tunnel zones from the node: the
  // delegation at the parent's own servers, the front and the backend on
  // the node, and each zone through public resolvers with dnsprobe-v1
  // (docs/design/observability.md). Without now it returns the last periodic
  // check (rayd -dns-check). now checks at once, at most once per 30 s:
  // a call within that gets the last check (limited), calls at the same
  // time share one. The answer holds no secret.
  rpc CheckDNSZones(CheckDNSZonesRequest) returns (CheckDNSZonesResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }

  // Backup returns a consistent copy of the node's database. Root only: it
  // holds every key (R4-13); rayctl encrypts it with the operator's
  // passphrase, which never reaches rayd.
  rpc Backup(BackupRequest) returns (BackupResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // GetMetrics returns aggregate metrics in the Prometheus text format, no
  // names of users, devices or services (R4-14).
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,SUPPORT";
  }
  // The node's statistics over a window, an hour by default, as JSON
  // (spec/stats-v1.md): counts, levels and the host, no names, addresses,
  // domains or keys.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,SUPPORT";
  }

  // GetSummary returns the state of the client summaries (R4-21): whether
  // the node takes reports, the AS lookup, and the networks with at least
  // k reports; smaller groups only as a total.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetSummary turns the reports on or off, and the online AS lookup. The
  // token is stored by rayd and never returned.
  rpc SetSummary(SetSummaryRequest) returns (SetSummaryResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // GetAppMirror reports the mirror of the client's releases
  // (spec/app-update-v1.md): on or off, what it holds, the last check.
  rpc GetAppMirror(GetAppMirrorRequest) returns (GetAppMirrorResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetAppMirror turns it on (with 1 GiB free for it) or off (its files
  // go).
  rpc SetAppMirror(SetAppMirrorRequest) returns (SetAppMirrorResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // The node's update by request (spec/node-update-v1.md): an admin asks
  // for a signed release, newer than the node, while root has turned
  // remote updates on (rayctl update remote on, a file of root's that rayd
  // only reads); a root unit runs it.
  rpc StartUpdate(StartUpdateRequest) returns (StartUpdateResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse) {
    option (google.api.method_visibility).restriction = "ADMIN,SUPPORT";
  }
  // SetDebug opens the debug window for a while or closes it: rayd, rayspa
  // and niko-server log at debug level until it ends by itself
  // (docs/design/observability.md §3). Root on the node only.
  rpc SetDebug(SetDebugRequest) returns (SetDebugResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // SetNodeName names the node, or takes its name away with "": clients
  // show it with the node's address (subscription-v1 §3, field name).
  rpc SetNodeName(SetNodeNameRequest) returns (SetNodeNameResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetNodeNote sets the node's note for its users, or takes it away with
  // "": clients show it with the node (subscription-v1 §3, field note).
  rpc SetNodeNote(SetNodeNoteRequest) returns (SetNodeNoteResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // GetClientPolicy returns the node's minimum client version
  // (spec/client-min-v1.md §2) and how many devices last named which
  // client in the last 30 days (§5).
  rpc GetClientPolicy(GetClientPolicyRequest) returns (GetClientPolicyResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetClientPolicy sets it, or takes it away with no minimum.
  rpc SetClientPolicy(SetClientPolicyRequest) returns (SetClientPolicyResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // GetIntegrationSettings returns how the node treats its integrations'
  // devices (docs/spec/integrations-v1.md §2.2, §2.4, §2.6) and their
  // calls since rayd started (§11).
  rpc GetIntegrationSettings(GetIntegrationSettingsRequest) returns (GetIntegrationSettingsResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // SetIntegrationSettings changes what is given: support's sight of
  // notes and the traffic counting by an admin too; the rate limits and
  // the mass actions' limit by root on the node only.
  rpc SetIntegrationSettings(SetIntegrationSettingsRequest) returns (SetIntegrationSettingsResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
  // GetEgress returns the node's egress policy (spec/egress-policy-v1.md):
  // what the data plane may not send, on every profile. On the node's
  // socket only.
  rpc GetEgress(GetEgressRequest) returns (GetEgressResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // SetEgress blocks or allows BitTorrent and SMTP (TCP 25); rayspa applies
  // it within a second or two. Root on the node only.
  rpc SetEgress(SetEgressRequest) returns (SetEgressResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // GetConnLimit says whether the per-user connection limits and the
  // per-address limit on new inbound connections are on
  // (spec/conn-limit-v1.md §8), with the conntrack table, the guard and the
  // users at a limit in the last 15 minutes. On the node's socket only.
  rpc GetConnLimit(GetConnLimitRequest) returns (GetConnLimitResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // SetConnLimit turns those limits on or off; the table's size, notrack and
  // the guard stay. Root on the node only.
  rpc SetConnLimit(SetConnLimitRequest) returns (SetConnLimitResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }

  // GetDeployment returns the deployment rayd builds for the current
  // services: system users, unit files and other files. rayctl before
  // v0.21.0 installs it as it is; rayctl since builds its own from
  // GetDeployInputs and takes nothing from here. Root on the node only.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // GetDeployInputs returns what root builds the deployment from
  // (docs/spec/apply-plan-v1.md §3.3): the services and the node's facts,
  // which rayctl apply checks before it builds anything. No keys, no file
  // contents. Root on the node only.
  rpc GetDeployInputs(GetDeployInputsRequest) returns (GetDeployInputsResponse) {
    option (google.api.method_visibility).restriction = "NODE";
  }
  // GetPorts lists every port the node uses or admits, for a provider's
  // firewall or a NAT (rayctl ports): no keys, the current port of each
  // rotating range.
  rpc GetPorts(GetPortsRequest) returns (GetPortsResponse) {
    option (google.api.method_visibility).restriction = "ADMIN";
  }
}

message GetPortsRequest {}
message GetPortsResponse {
  repeated NodePort ports = 1;
}
// NodePort is a port, or a range of them, of the node.
message NodePort {
  // "spa", "sub", "api", "acme", or the service's name; a service's UDP
  // rotation range is "<name> rotation".
  string name = 1;
  repeated string protos = 2; // "tcp", "udp"
  uint32 from = 3;
  uint32 to = 4; // from for one port
  // "fixed" (443, 53, 80), "random" (drawn by the node), "chosen"
  // (rayctl install -ports) or "sshd" (where sshd listened at install).
  string source = 5;
  // Who reaches it: "everyone" (SPA itself, the DNS tunnels, an open
  // REALITY), "spa" (an address after its knock), "admin" (the admin
  // addresses, and after a knock a device allowed SSH), "acme" (TCP 80
  // while a certificate is issued without a DNS provider).
  // "spa,static" for the API while an integration's device calls from its
  // addresses without a knock (integrations-v1 §3.2).
  string access = 6;
  uint32 current = 7;      // a rotating range: the port of this slot (the slots on either side are open too)
  int64 current_until = 8; // unix seconds: when current changes
}

message SetDNSProviderRequest {
  string provider = 1; // cloudflare
  string token = 2;    // API token: Zone.DNS:Edit and Zone.Zone:Read on the node's zone
}
message SetDNSProviderResponse { DNSStatus status = 1; }

message GetDNSRequest {}
message GetDNSResponse { DNSStatus status = 1; }

message SyncDNSRequest {}
message SyncDNSResponse { DNSStatus status = 1; }

message RemoveDNSRequest {
  bool keep_records = 1; // forget the provider but leave the records in the zone
}
message RemoveDNSResponse { repeated string removed = 1; }

message DNSStatus {
  string provider = 1; // "" when the node has none
  string zone = 2;
  repeated DNSRecord records = 3; // what the node needs in the zone
  repeated string changes = 4;    // what a sync changed
  repeated string problems = 5;   // conflicts, records that cannot be made
}

message DNSRecord {
  string type = 1;
  string name = 2;
  string content = 3;
}

message CheckDNSZonesRequest {
  bool now = 1; // check now instead of returning the last periodic check
  // Ask these resolvers instead of rayd's (-dns-check-resolvers), now:
  // google, cloudflare, quad9, nsdi, msk-ix, yandex, system, udp:IP or
  // tcp:IP. The Russian ones and system only warn.
  repeated string resolvers = 2;
}
message CheckDNSZonesResponse {
  int64 checked_at = 1; // unix seconds; 0: no check yet
  int64 next_at = 2;    // the next periodic check, unix seconds; 0: none
  bool limited = 3;     // now came within 30 s of the last check: this is that one
  repeated string resolvers = 4; // those asked, as "google 8.8.8.8"
  repeated DNSZoneCheck zones = 5;
  uint32 duration_ms = 6;
}

// DNSZoneCheck is one zone's check.
message DNSZoneCheck {
  string service = 1;
  string kind = 2;    // dnstt | masterdns
  string zone = 3;
  string ns = 4;      // the name the parent should delegate it to; "" when the delegation is the operator's own
  string state = 5;   // ok | warn | fail
  string summary = 6;
  string error = 7;   // why the zone fails; "" when it does not
  bool delegated = 8; // the parent delegates it to the node: resolvers were asked
  DNSCheckStep parent = 9;
  DNSCheckStep front = 10;
  DNSCheckStep backend = 11;
  repeated DNSResolverCheck resolvers = 12;
}

// DNSCheckStep is one step of a zone's check.
message DNSCheckStep {
  string state = 1; // ok | warn | fail | skip
  string detail = 2;
  string fix = 3;
  uint32 rtt_ms = 4;
}

// DNSResolverCheck is a zone through one resolver.
message DNSResolverCheck {
  string resolver = 1;    // "google 8.8.8.8", "udp:192.0.2.9"
  string network = 2;     // udp | tcp
  bool warn_only = 3;     // its failures only warn
  DNSCheckStep soa = 4;   // the apex (dnstt with an NS name); it may come from its cache
  DNSCheckStep small = 5; // the small probe (dnstt); an answer to a random name (masterdns)
  DNSCheckStep large = 6; // the large probe (dnstt)
  uint32 edns = 7;        // the UDP size it advertised to the node; 0: none, or not seen
  bool case_randomized = 8; // 0x20 seen by the node
  string egress = 9;      // its address as the node saw it
}

message BackupRequest {}
message BackupResponse {
  bytes database = 1;
  string node_id = 2;
  string version = 3;
  int64 created_at = 4;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  string text = 1;
}

message GetStatsRequest {
  // The window in seconds, 300 to 7200; 0: an hour.
  int64 last_seconds = 1;
}
message GetStatsResponse {
  // The report (stats.Report) as JSON.
  bytes json = 1;
}

message GetAdminAccessRequest {}
message GetAdminAccessResponse { repeated string cidrs = 1; }

message SetAdminAccessRequest { repeated string cidrs = 1; }
message SetAdminAccessResponse {}

message Relay {
  string name = 1;
  string address = 2;
  int64 created_at = 3;
  uint32 probe_port = 4; // its probe endpoint, TCP and UDP (relay-v1 §9.1); 0: none
  // Every port the relay host takes from outside, for a provider's
  // firewall in front of it (rayctl relay ports): its SSH, its SPA range
  // and probe endpoint once its bundle is out (rayctl relay bundle makes
  // them), and the exit's ports it forwards, as its perimeter has them
  // now. Since v0.31.0; empty from a node before.
  repeated RelayPort ports = 5;
  // The relay's names (relay-names-v1 §3): one for each service it
  // forwards whose SNI is the node's, resolving to the relay's address.
  // Since v0.35.0; empty from a node before.
  repeated RelayName names = 6;
}
// RelayName is a relay's name for one service of the node.
message RelayName {
  string service = 1; // the service's name
  string name = 2;    // one label under the node's domain
  // Clients may be given it: the certificate of the service's site covers
  // it and it resolves to the relay's address alone, as the node last
  // checked (relay-names-v1 §4, §5).
  bool ready = 3;
  string problem = 4; // why it is not ready
}
// RelayPort is a port, or a range of them, a relay host takes.
message RelayPort {
  // "ssh" (the relay host's own), "spa" (the relay's SPA range), "probe"
  // (its probe endpoint), or what it forwards to the exit: "sub", "api" or
  // the service's name.
  string name = 1;
  repeated string protos = 2; // "tcp", "udp"
  uint32 from = 3;
  uint32 to = 4;              // from for one port
  bool forwarded = 5;         // to the exit, on the same port; else the relay host answers itself
  // Who reaches it: "everyone" (SPA), "spa" (an address after its knock at
  // the relay), "admin" (the relay's admin addresses, and after a knock a
  // device allowed SSH), "acme" (any address while the exit orders a
  // certificate with the relay's names, up to 3 minutes: TCP 80, since
  // v0.35.0, relay-names-v1 §6).
  string access = 6;
}
message AddRelayRequest {
  string name = 1;
  string address = 2;  // one public IP
}
message AddRelayResponse { Relay relay = 1; }
message ListRelaysRequest {}
message ListRelaysResponse { repeated Relay relays = 1; }
message RemoveRelayRequest { string name = 1; }
message RemoveRelayResponse {}
message IssueRelayBundleRequest {
  string name = 1;
  string exit_address = 2;  // the exit's IP; empty: the node's host if it is one
  uint32 ssh_port = 3;      // the relay host's SSH; 0 keeps it (22 at first)
  // Addresses that reach the relay host's SSH without SPA (its own, never
  // the exit's list); empty keeps them; a relay needs some. Devices allowed
  // the exit's SSH may also open it by SPA with their K_relay.
  repeated string admin = 4;
  // Used when admin is empty and the relay has no list yet: rayctl's
  // default, the address of the SSH session it runs in.
  repeated string admin_if_none = 5;
}
message IssueRelayBundleResponse {
  string bundle = 1;
  uint32 ssh_port = 2;       // the relay host's SSH port now
  repeated string admin = 3; // and its admin addresses
  bool admin_kept = 4;       // the relay's list from before, none asked for
  uint32 probe_port = 5;     // its probe endpoint, TCP and UDP (relay-v1 §9.1)
  // Every port the relay host takes with this bundle (Relay.ports), for a
  // provider's firewall in front of it. Since v0.31.0.
  repeated RelayPort ports = 6;
}
message SetRelayAccessRequest {
  string name = 1;
  uint32 ssh_port = 2;       // 0 keeps it
  repeated string admin = 3; // empty keeps them
}
message SetRelayAccessResponse {}

message GetDeploymentRequest {}
message GetDeploymentResponse {
  repeated SystemUser users = 1;
  repeated DeployFile files = 2;
  repeated string units = 3;     // units to enable and keep running
  repeated string warnings = 4;
  // Ports clients reach; host firewalls (firewalld, ufw) must let them through.
  repeated PortRange host_ports = 5;
  // The same ports as they arrive from outside, before the node's own
  // redirects (the ACME window is TCP 80 there): what a provider's firewall
  // in front of the host must let in.
  repeated PortRange outside_ports = 6;
  // The front answers DNS tunnels on UDP 53 (beside systemd-resolved's stub).
  bool front_dns = 7;
  // A naive service carries ICMP (icmp=on, spec/icmp-v1.md): the data
  // plane's groups must be in net.ipv4.ping_group_range.
  bool icmp = 8;
}

message PortRange {
  string proto = 1; // tcp | udp
  uint32 from = 2;
  uint32 to = 3;    // inclusive
}

message SystemUser {
  string name = 1;
  uint32 uid = 2;
  repeated string extra_groups = 3; // groups the user joins
}

message DeployFile {
  string path = 1;
  uint32 mode = 2;
  bytes content = 3;
}

message GetDeployInputsRequest {}
message GetDeployInputsResponse {
  repeated DeployService services = 1; // the enabled services
  bool front_tcp = 2;                  // TCP 443 is behind the front (tcpmux)
  bool front_rendered = 3;             // the front's config is rendered
  bool front_dns = 4;                  // the front answers DNS tunnels on UDP 53
  bool dns_probe_key = 5;              // the front's dnsprobe-v1 key is rendered
  // The subscription endpoint's port, 0 without one: the channel probes of
  // naive and Hysteria2 go there.
  uint32 subscription_port = 6;
  repeated PortRange host_ports = 7;    // as in GetDeploymentResponse
  repeated PortRange outside_ports = 8; // as in GetDeploymentResponse
  repeated string warnings = 9;         // rayd's: what it could not render, and why
}

// DeployService is a service as root builds its units: what of its
// settings goes into them, nothing else.
message DeployService {
  string kind = 1;
  string name = 2;
  uint32 uid = 3;        // the user of its process, 0 without one
  string answer = 4;     // site: what it answers
  string site = 5;       // reality, naive: the node's site it relies on
  bool public_peers = 6; // yggdrasil: it dials public peers
  bool salamander = 7;   // hy2-obfs: the front's copy of its salamander password is rendered
  DeploySlipstream slipstream = 8;
  bool icmp = 9;         // naive: it carries ping and traceroute (icmp=on, spec/icmp-v1.md)
  bool udp = 10;         // naive: it carries UDP as HTTP/3 datagrams (udp=on, spec/naive-udp-v1.md)
}

// DeploySlipstream are a slipstream service's settings
// (spec/slipstream-v1.md §3), or why rayd could not read them.
message DeploySlipstream {
  string zone = 1;
  string quic_alpn = 2;
  string quic_sni = 3;
  uint32 max_connections = 4;    // 0: the default
  uint32 device_connections = 5; // 0: the default
  string error = 6;              // not empty: the service is left out, with this warning
}

message GetStatusRequest {}
message GetStatusResponse {
  string version = 1;
  string node_id = 2;
  string host = 3 [(google.api.field_visibility).restriction = "ADMIN"];
  uint32 users = 4;
  uint32 services = 5;
  uint32 active_devices = 6;
  // SPA ports open right now (previous, current and next slot).
  repeated uint32 spa_ports = 7 [(google.api.field_visibility).restriction = "ADMIN"];
  // rayd's loops: when each last succeeded and failed (O-2).
  repeated LoopHealth loops = 8;
  // The end of the debug window (rayctl debug), unix seconds; 0: none.
  int64 debug_until = 9 [(google.api.field_visibility).restriction = "ADMIN"];
  // The node's name (rayctl node name); empty: none.
  string name = 10;
  string note = 11;
  // The node's egress policy (rayctl egress); on the node's socket only,
  // absent through the remote API.
  Egress egress = 12 [(google.api.field_visibility).restriction = "ADMIN"];
}

// Egress is what the data plane may not send, whoever the user
// (spec/egress-policy-v1.md).
message Egress {
  bool bittorrent = 1; // the handshake, uTP SYN, UDP tracker connect, DHT queries
  bool smtp = 2;       // TCP to port 25
  // The node's own and local networks (R4-38): blocked unless the
  // administrator allowed them. False from an older rayd, which does not
  // block them in the perimeter.
  bool local = 3;
}

message GetEgressRequest {}
message GetEgressResponse {
  Egress egress = 1;
  // Processes it covers besides the data plane (UIDs 9100-9179): rayd's own
  // where the data plane runs as its children (rayd serve -supervise).
  repeated uint32 uids = 2;
}

message SetEgressRequest {
  // Only the parts given change.
  optional bool bittorrent = 1;
  optional bool smtp = 2;
  optional bool local = 3;
}
message SetEgressResponse {
  Egress egress = 1; // as kept
}

message GetConnLimitRequest {}
message GetConnLimitResponse {
  // The limits are off (rayctl conn-limit off); absent setting: on.
  bool off = 1;
  // The node's conntrack table, as rayd reads it; absent where it cannot.
  Conntrack conntrack = 2;
  // The guard as rayspa last reported it (spec/conn-limit-v1.md §6.3);
  // absent before its first report since rayd started.
  ConnGuard guard = 3;
  // Users who met a limit in the last 15 minutes, by number and service.
  repeated ConnLimitUser users = 4;
  // Refusals since rayd started reading them, by service and kind (tcp,
  // rate, failed, udp, evicted, dest, live, lookup).
  repeated ConnLimitRefused refused = 5;
}

// Conntrack is the kernel's connection table.
message Conntrack {
  uint64 count = 1;
  uint64 max = 2;
  uint64 dropped = 3;       // "drop", summed over CPUs: the table was full
  uint64 early_dropped = 4; // "early_drop": entries pushed out for new ones
  // Drops in the last 15 minutes, as rayd saw them.
  uint64 dropped_recent = 5;
}

// ConnGuard is rayspa's guard of the conntrack table.
message ConnGuard {
  bool on = 1;
  int64 since = 2;    // unix seconds: the last switch, on or off
  int64 last_on = 3;  // unix seconds: the last switch on; 0: never
  uint64 switches = 4;
  uint64 refused = 5; // new data-plane flows it refused
  uint64 swept_udp = 6;
  uint64 swept_tcp_out = 7;
  uint64 swept_tcp_in = 8;
  int64 reported = 9; // unix seconds: rayspa's report
}

message ConnLimitUser {
  int64 id = 1;
  string service = 2;
  uint64 refused = 3; // refusals in the last 15 minutes
}

message ConnLimitRefused {
  string service = 1;
  string kind = 2;
  uint64 total = 3;
}

message SetConnLimitRequest {
  bool off = 1;
}
message SetConnLimitResponse {
  bool off = 1; // as kept
}

message SetNodeNameRequest {
  // At most 48 characters; runs of spaces become one. Empty removes it.
  string name = 1;
}
message SetNodeNameResponse {
  string name = 1; // as kept
}

message SetNodeNoteRequest {
  // At most 200 characters (code points) on one line; runs of spaces
  // become one. Empty removes it.
  string note = 1;
}
message SetNodeNoteResponse {
  string note = 1; // as kept
}

// The node's minimum client version (spec/client-min-v1.md §2).
message ClientPolicy {
  // min: the lowest version taken by product, semver ("niko": "1.59.0");
  // none: no policy.
  map<string, string> min = 1;
  // from: unix seconds when it starts; 0: it holds already.
  int64 from = 2;
  // refuse_unknown refuses clients that name no version too: released Niko
  // up to 1.58 then deletes the node's profiles (client-min-v1 §9.1).
  bool refuse_unknown = 3;
}
message ClientCount {
  string client = 1; // "niko/1.59.0"; "" for devices that named none
  uint32 devices = 2;
}
// Rate is a token bucket (integrations-v1 §2.6): up to burst calls at
// once, burst back at per_hour an hour.
message Rate {
  uint32 burst = 1;
  uint32 per_hour = 2;
}

// IntegrationLimits are the rate limits of an integration's device: reads,
// changes, and invites, revocations and renewals (heavy); calls under way
// at once. A rate absent: the role makes no such call.
message IntegrationLimits {
  Rate read = 1;
  Rate write = 2;
  Rate heavy = 3;
  uint32 inflight = 4;
}

// IntegrationLimitsFor are the limits of a role (billing, support), or of
// one device of one, in place of its role's.
message IntegrationLimitsFor {
  string role = 1;
  string device_id = 2;
  IntegrationLimits limits = 3;
  bool set = 4; // root's, not the default
}

// IntegrationDevice is an integration's device and its calls since rayd
// started (integrations-v1 §11).
message IntegrationDevice {
  string id = 1;
  string user = 2;
  string name = 3;
  string role = 4;
  int64 last_call = 5; // unix seconds; 0: none
  uint64 calls = 6;
  uint64 denied = 7;  // by its role
  uint64 limited = 8; // over its rate limits
}

message GetIntegrationSettingsRequest {}
message GetIntegrationSettingsResponse {
  // support sees users' notes (rayctl integration set support-notes on).
  bool support_notes = 1;
  // billing's deletions and disables together an hour, past which a call
  // needs confirm_mass; 0: every one does.
  uint32 mass_limit = 2;
  // on: the node counts traffic with no limit set too, and no limit set or
  // taken away restarts Xray; auto: only while some user has a limit.
  string traffic_counting = 3;
  // The limits in force: each role's, then each device's own.
  repeated IntegrationLimitsFor limits = 4;
  repeated IntegrationDevice devices = 5;
  uint32 mass_actions = 6; // billing's in the last hour
  uint64 mass_refused = 7; // refused for the limit since rayd started
}

message SetIntegrationSettingsRequest {
  optional bool support_notes = 1;
  optional uint32 mass_limit = 2;       // root on the node
  optional string traffic_counting = 3; // on | auto
  // limits: root on the node; for a role or a device, its limits, or with
  // to_default its default back.
  IntegrationLimitsFor limits = 4;
  bool to_default = 5;
}
message SetIntegrationSettingsResponse {}

message GetClientPolicyRequest {}
message GetClientPolicyResponse {
  ClientPolicy policy = 1;
  // The devices not revoked by the client they last named, of those seen
  // in the last 30 days, and those never seen with one; most first.
  repeated ClientCount clients = 2;
}
message SetClientPolicyRequest {
  ClientPolicy policy = 1;
}
message SetClientPolicyResponse {
  ClientPolicy policy = 1; // as kept
}

message LoopHealth {
  string name = 1;     // apply, acme <site>, dns, reality-rotation, ...
  int64 last_ok = 2;   // unix seconds, 0 = never
  int64 last_error = 3; // unix seconds, 0 = never
  string error = 4 [(google.api.field_visibility).restriction = "ADMIN"]; // the last error
  uint64 runs = 5;
  uint64 errors = 6;
  bool failing = 7;    // the last round failed (rayd after v0.10.0)
  string detail = 8 [(google.api.field_visibility).restriction = "ADMIN"]; // what the last round found (dns-zone <service>: the zone's summary)
}

message User {
  int64 id = 1;
  string name = 2;
  bool enabled = 3;
  int64 expires_at = 4;          // unix seconds, 0 = never
  int64 traffic_limit_bytes = 5; // 0 = unlimited
  // Not support's unless the administrator allows it (integrations-v1
  // §2.2): personal data goes there.
  string note = 6 [(google.api.field_visibility).restriction = "ADMIN,BILLING,NOTES"];
  int64 created_at = 7;
  repeated string services = 8;  // service names
  // The traffic limit's count (docs/spec/traffic-limit-v1.md §3.6); all
  // zero without a limit. used is up + down of the current period, as the
  // node last wrote it (a minute behind at most).
  int64 traffic_used_bytes = 9;
  int64 traffic_period_start = 10; // unix seconds
  string traffic_period = 11;      // monthly | none
  int32 traffic_reset_day = 12;    // 1..28, monthly only
  int64 traffic_next_reset = 13;   // unix seconds, 0 = none
  // The node took the user off its profiles for the limit: an enabled,
  // unexpired user whose used reached it (as the subscription's
  // exhausted). The node decides, not a comparison of the two fields.
  bool traffic_exhausted = 14;
  // The administrator lets the user's devices see each other over
  // Yggdrasil (docs/spec/lan-v1.md §1.1); each device decides for itself
  // too (Device.lan).
  bool lan = 15;
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  string name = 1;
  int64 expires_at = 2;
  int64 traffic_limit_bytes = 3;
  string note = 4;
  repeated string services = 5;
  string traffic_period = 6;    // monthly (default) | none
  int32 traffic_reset_day = 7;  // 1..28, default 1
}
message CreateUserResponse { User user = 1; }

// SetUserTrafficRequest changes what is set and leaves the rest:
// limit_bytes 0 removes the limit (and its count); a first limit counts
// from now. period and reset_day apply to the next periods: a change does
// not zero the count. reset_usage zeroes the current period's count from
// now.
message SetUserTrafficRequest {
  string name = 1;
  optional int64 limit_bytes = 2;
  optional string period = 3;
  optional int32 reset_day = 4;
  bool reset_usage = 5;
  // As SetUserEnabledRequest's: billing's limit under 1 MiB, or less than
  // 1 MiB over what the user has used this period, cuts the user off, a
  // mass action (integrations-v1 §2.4).
  bool confirm_mass = 6;
}
message SetUserTrafficResponse { User user = 1; }

message SetUserLANRequest {
  string name = 1;
  bool lan = 2;
}
message SetUserLANResponse { User user = 1; }

message SetUserEnabledRequest {
  string name = 1;
  bool enabled = 2;
  // confirm_mass: billing's disable over the hour's limit of mass actions
  // goes through (integrations-v1 §2.4). A node before it does not read
  // it, and has no such limit.
  bool confirm_mass = 3;
}
message SetUserEnabledResponse {}

message SetUserServicesRequest {
  string name = 1;
  repeated string services = 2;
  // As SetUserEnabledRequest's: billing's list without an enabled service
  // cuts the user off, a mass action (integrations-v1 §2.4).
  bool confirm_mass = 3;
}
message SetUserServicesResponse {}

message DeleteUserRequest {
  string name = 1;
  bool confirm_mass = 2; // as SetUserEnabledRequest's
}
message DeleteUserResponse {}

message GetUserRequest { string name = 1; }
message GetUserResponse { User user = 1; }

message SetUserExpiryRequest {
  string name = 1;
  // unix seconds; 0: never; a time not after now: expired now.
  int64 expires_at = 2;
  // confirm_mass: as SetUserEnabledRequest's; billing's expiry now, or in
  // 10 minutes or less, is a mass action like a disable (integrations-v1
  // §2.4).
  bool confirm_mass = 3;
}
message SetUserExpiryResponse { User user = 1; }

message ExportUserRequest { string name = 1; }

message RenewUserRequest { string name = 1; }
message RenewUserResponse {
  string name = 1;
  // credentials: how many of the user's credentials are new: one for
  // each service the user has or had a credential on, the inner one
  // behind the DNS tunnels and Yggdrasil included.
  uint32 credentials = 2;
}
message ExportUserResponse {
  repeated Profile profiles = 1;
}
// Profile is one profile of the subscription.
message Profile {
  uint32 service_id = 1;
  string service = 2;
  string link = 3;
  // next_link replaces link from next_from (unix seconds) on; empty when
  // nothing is pending.
  string next_link = 4;
  int64 next_from = 5;
}

// Service: an integration sees id, kind, name and enabled only
// (integrations-v1 §2.3).
message Service {
  uint32 id = 1; // also the SPA scope ID
  string kind = 2;
  string name = 3;
  bool enabled = 4;
  // The service's settings, without a next server name not yet published
  // (REALITY's sni_next waiting for its certificate, naive's chosen ahead;
  // raycontrol v0.29.0): no client has it, and nothing shows it.
  string settings_json = 5 [(google.api.field_visibility).restriction = "ADMIN"];
  int64 created_at = 6 [(google.api.field_visibility).restriction = "ADMIN"];
  uint32 uid = 7 [(google.api.field_visibility).restriction = "ADMIN"]; // system user of the service's process, 0 if none
  // The server name in the service's links (settings' sni): REALITY,
  // naive, DoH, hy2-masq, hy2-obfs, Yggdrasil, a site; empty for the
  // others (raycontrol v0.29.0).
  string sni = 8 [(google.api.field_visibility).restriction = "ADMIN"];
  // REALITY and naive: the server name in subscriptions from next_from on,
  // only once published (R4-7, R4-42); empty when no switch is published
  // or the published one keeps the name. A naive service has its next name
  // chosen and served earlier: it shows here once clients get it.
  string sni_next = 9 [(google.api.field_visibility).restriction = "ADMIN"];
  // REALITY and naive: the published switch, unix seconds; 0: none.
  int64 next_from = 10 [(google.api.field_visibility).restriction = "ADMIN"];
}

message ListServicesRequest {}
message ListServicesResponse {
  repeated Service services = 1;
  repeated string kinds = 2; // kinds this node can run
}

message CreateServiceRequest {
  string kind = 1;
  string name = 2;
  string settings_json = 3;
}
message CreateServiceResponse { Service service = 1; }

message SetServiceEnabledRequest {
  string name = 1;
  bool enabled = 2;
  // Disabling the last enabled service of kind ssh is failed_precondition
  // (raycontrol after v0.26.0): its ports are what the perimeter admits
  // SSH on from the admin addresses, and without one SSH is closed to all
  // at the next snapshot. force disables it anyway.
  bool force = 3;
}
message SetServiceEnabledResponse {}

message DeleteServiceRequest {
  string name = 1;
  // As SetServiceEnabledRequest.force: deleting the last enabled service
  // of kind ssh is failed_precondition without it.
  bool force = 2;
}
message DeleteServiceResponse {}

message SetServiceOptionRequest {
  string name = 1;
  string key = 2;
  string value = 3;
}
message SetServiceOptionResponse {
  Service service = 1;
}

message GetYggdrasilPeerKeysRequest {
  string service = 1; // a Yggdrasil service's name
  // With the users' and devices' names (YggdrasilPeerKey.user, .device).
  // Without, each key has only its label, the node's own numbers: the
  // keys go into a config on a host outside the node, which names nobody
  // unless the operator asks (lan-v1 §4.3).
  bool names = 2;
}
message GetYggdrasilPeerKeysResponse {
  string service = 1;
  string node_key = 2;     // the node's ed25519 public key in the mesh, hex
  string node_address = 3; // the node's mesh address (200::/7)
  repeated YggdrasilPeerKey keys = 4;
}
// YggdrasilPeerKey is one key a Yggdrasil service lets in: a public key,
// whose it is and from which inner UUID of the user's rotation.
message YggdrasilPeerKey {
  string public_key = 1; // ed25519, hex
  string address = 2;    // its mesh address
  string user = 3;       // the user's name; only with names
  // The device's ID; "": the user's own key, from the UUID alone (links of
  // rayctl user export, subscriptions before v0.20.1).
  string device_id = 4;
  string device = 5; // the device's name; only with names
  // "current", "next" (in subscriptions already: clients move to it at
  // from) or "previous" (the node still takes it until until).
  string credential = 6;
  int64 from = 7;  // unix seconds; next only
  int64 until = 8; // unix seconds; previous only
  // Its name in the backend's users file: u<user id>, -<device id> for a
  // device's, -n for the next UUID's, -p for the previous one's.
  string label = 9;
}

message SetCertificateRequest {
  string service = 1; // a site
  bytes chain_pem = 2; // leaf first
  bytes key_pem = 3;
  // The lines under the site carry the pins of the node's keys and this
  // certificate has another key: failed_precondition, since every client
  // that holds the pins would refuse it until it fetches its subscription;
  // force imports it anyway (spec/cert-pin-v1.md §7).
  bool force = 4;
}
message SetCertificateResponse {
  repeated string names = 1; // the site's names in use, all covered
  int64 not_after = 2; // unix seconds
  // Names REALITY moves to at its next key switch that the certificate
  // does not cover: the switch waits for a certificate that does.
  repeated string missing_next = 3;
  // The lines of the services under the site carried the pins of the
  // node's keys (niko-pin, spec/cert-pin-v1.md §7), and this certificate
  // has another key: clients fail their pin until they get their
  // subscription again, whose lines carry none now. Only with force.
  bool unpinned = 4;
}

message RotateServiceRequest {
  string name = 1;
  bool now = 2;
  // dnstt and masterdns: a switch with a grace (now unset) while the
  // previous key is still in its grace is failed_precondition (it would
  // drop that key for clients still on it); force switches anyway and
  // drops it, as before raycontrol v0.24.0. A site: the switch to the next
  // certificate key before that key has been in subscriptions for the lead
  // is failed_precondition (clients that do not hold its pin yet would be
  // cut off); force switches anyway, unless the key in use is younger than
  // a subscription's lifetime (72 h: failed_precondition, the key after it
  // is missing from lists in use). now means nothing for a site.
  bool force = 3;
  // A site: the certificate moves to a key made for this order, and the
  // next key is replaced too (both were in a store that leaked). No client
  // holds its pin: all fail theirs until they fetch their subscription.
  // Needs no force; audited as its own action.
  bool fresh = 4;
}
message RotateServiceResponse {
  int64 switch_at = 1; // unix seconds; later if a new server name waits for its certificate
  bool seal = 2; // a dnstt service: its seal key switched at switch_at
  int64 prev_until = 3; // the previous seal key is accepted until then (unix seconds); 0: no longer
  // The key that switched at once: "seal" (dnstt, seal set too), "service"
  // (masterdns, spec/masterdns-key-rotation.md; seal set too, for rayctl
  // before v0.15.0); "tls" for a site, whose certificate with another key
  // rayd orders from switch_at on (spec/cert-pin-v1.md §5); empty for
  // REALITY's scheduled switch.
  string key = 4;
  // The service's kind (raycontrol v0.29.0): "naive" is a switch of its
  // server name alone (R4-42), at switch_at or once its certificate covers
  // the new name; the previous name stays accepted until the switch after.
  string kind = 5;
  // naive: the previous names that stay routed after the switch, newest
  // first (the name in use now first): each until a switch a period
  // (-naive-sni-period) after the one that left it, 3 at most.
  repeated string kept_names = 6;
  // naive: the previous names the switch takes off the front, left a
  // period ago or more, or the oldest over 3. Devices that know only one of
  // them lose naive until they fetch their subscription.
  repeated string dropped_names = 7;
}

message Device {
  string id = 1;
  string user = 2;
  string name = 3;
  string role = 4; // user | admin | billing | support
  int64 created_at = 5;
  int64 revoked_at = 6; // 0 = active
  bool registered = 7; // through the remote API, with a client certificate
  // The device shows itself in its user's LAN, as its X-Raycontrol-LAN
  // header last said (docs/spec/lan-v1.md §1.1); it is in the LAN when its
  // user's lan is on too.
  bool lan = 8;
  // The client its subscription requests last named, "niko/1.59.0", and
  // when the node saw it, unix seconds (spec/client-min-v1.md §5); "", 0:
  // never.
  string client = 9;
  int64 client_at = 10;
  // An integration's device in the mode of addresses (integrations-v1
  // §3.2): the prefixes it calls from, without a knock; empty: it knocks.
  repeated string allow = 11 [(google.api.field_visibility).restriction = "ADMIN"];
  // An integration's device: its last call through the remote API, unix
  // seconds, kept to the hour; 0: none yet.
  int64 last_call = 12 [(google.api.field_visibility).restriction = "ADMIN"];
}

// Invite is an invite not yet used.
message Invite {
  string id = 1;
  string user = 2;
  string name = 3; // of the device it becomes
  string role = 4;
  int64 created_at = 5;
  int64 expires_at = 6;
  // pin_tries: the invite needs a PIN, with this many wrong ones left; 0:
  // no PIN.
  int32 pin_tries = 7;
  // The addresses the device it becomes calls from (integrations-v1 §3.2);
  // it registers from one of them.
  repeated string allow = 8 [(google.api.field_visibility).restriction = "ADMIN"];
}

message ListDevicesRequest { string user = 1; }
message ListDevicesResponse {
  repeated Device devices = 1;
  repeated Invite invites = 2;
}

message CreateDeviceRequest {
  string user = 1;
  string name = 2;
  string role = 3;
}
message CreateDeviceResponse {
  Device device = 1;
  string bundle = 2; // "rcdev1:..." (docs/spec/spa-v2.md)
}

message RevokeDeviceRequest {
  string id = 1;
  // overlap: the user's credentials rotate with the overlap of a scheduled
  // switch instead of being new at once (v0.31.0, docs/spec/api-v1.md
  // §5a): the user's other devices move over without a cut, and what the
  // revoked device knew is accepted until the grace after the switch ends.
  // For a planned replacement, not a stolen device. A node before v0.31.0
  // does not read it and makes them new at once.
  bool overlap = 2;
}
message RevokeDeviceResponse {
  // invite: the ID was an unused invite, now withdrawn; nothing else
  // changed. A node before v0.27.0 answers with none of these fields.
  bool invite = 1;
  // already: the device was revoked before; nothing changed this time.
  bool already = 2;
  // user and device: whose device it is, and its name.
  string user = 3;
  string device = 4;
  // credentials: how many of the user's credentials are new, as
  // RenewUserResponse counts them, not services, but without DoH's,
  // which a revocation keeps (v0.27.0); 0 for a user with none yet. With
  // overlap: how many rotate.
  uint32 credentials = 5;
  // switch_at and until, only for a revocation with overlap (v0.31.0):
  // when the user's devices switch to the next credentials it published
  // (unix seconds, the latest of them), and when the ones the revoked
  // device knew stop being accepted, switch_at plus the grace. rayd's
  // rotation runs every 10 minutes, so each comes up to 10 minutes later.
  // 0 without overlap, with no credentials, or from an older node. For a
  // device revoked already (already), until alone: while the rotation its
  // revocation with overlap began has not switched, when what it knew
  // stops being accepted (v0.31.0); 0 otherwise.
  int64 switch_at = 6;
  int64 until = 7;
}

message CreateInviteRequest {
  string user = 1;
  string name = 2; // of the device
  // user | admin | billing | support; billing and support only for a
  // user without services (integrations-v1 §2.1); billing invites users
  // only.
  string role = 3;
  int64 ttl_seconds = 4; // 0: a day; at most a week
  // pin: the invite also needs a PIN of 6 digits, told by another channel
  // (docs/spec/api-v1.md §3).
  bool pin = 5;
  // allow: billing and support only, the addresses of the integration's
  // server (integrations-v1 §3.2): the device registers from one of them
  // and calls without a knock. A node before it does not read it.
  repeated string allow = 6 [(google.api.field_visibility).restriction = "ADMIN"];
}
message CreateInviteResponse {
  Invite invite = 1;
  string invite_code = 2; // "rcinv1:..." (docs/spec/api-v1.md)
  string pin = 3; // the PIN, shown once; "" without
  string invite_code_short = 4; // the same invite as "RCINV2:..." (api-v1 §3a); "" if the host cannot go in it
  // What the node took of allow but would point out: a private network,
  // an admin address.
  repeated string warnings = 5 [(google.api.field_visibility).restriction = "ADMIN"];
  // The same invite by name, "RCINV3:..." (api-v1 §3b): with the node's
  // name (when it has one) and its SPA versions; "" if the host cannot go
  // in it. A node before v0.35.0 sends none.
  string invite_code_v3 = 6;
}

message SetDeviceAllowRequest {
  string id = 1;
  // Addresses or prefixes, IPv4 /28 to /32, IPv6 /64 to /128, at most 8
  // (integrations-v1 §3.3); they replace the device's. Empty: back to SPA.
  repeated string prefixes = 2;
}
message SetDeviceAllowResponse {
  Device device = 1;
  // What the node took but would point out: a private network, an admin
  // address.
  repeated string warnings = 2;
}

message AuditEntry {
  int64 time = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string result = 5;
}

message ListAuditRequest { uint32 limit = 1; }
message ListAuditResponse { repeated AuditEntry entries = 1; }

message GetSummaryRequest {
  // days counted: 1 to 30, 7 when 0.
  uint32 days = 1;
}
message GetSummaryResponse {
  bool enabled = 1;
  // api is the online lookup turned on ("ipinfo"), or empty.
  string api = 2;
  // dbs are the AS databases in lookup order.
  repeated SummaryDB dbs = 3;
  repeated SummaryNetwork networks = 4;
  // other_reports come from networks with fewer than k reports.
  int64 other_reports = 5;
  uint32 days = 6;
  uint32 k = 7;
}
message SummaryDB {
  string role = 1; // operator | release
  string path = 2;
  bool present = 3;
  int64 built = 4; // unix seconds, from the file's metadata
  string type = 5;
}
message SummaryNetwork {
  uint32 asn = 1;
  string name = 2;
  string country = 3;
  int64 reports = 4;
  map<string, int64> nets = 5;
  repeated SummaryService services = 6;
  map<string, int64> udp_mtu = 7; // reports by UDP MTU bucket
}
message SummaryService {
  uint32 id = 1;
  string name = 2;
  map<string, int64> results = 3;
  map<string, int64> udp = 4;
  map<string, int64> mbps = 5;
  map<string, int64> stall_kib = 6;
  // DNS tunnels: working observations by resolver kind (probe-v1 §6.1).
  map<string, int64> dns = 7;
  // dnstt: working observations by zone, "0" the main one, "1" to "4" its
  // spares in the links' order (probe-v1 §6, dnszones-v1 §3).
  map<string, int64> zone = 8;
}
message SetSummaryRequest {
  // enabled: "on" or "off"; empty leaves it.
  string enabled = 1;
  // api: "ipinfo" with a token turns the lookup on, "none" turns it off;
  // empty leaves it.
  string api = 2;
  string token = 3;
}
message SetSummaryResponse {}
message GetAppMirrorRequest {}
message GetAppMirrorResponse {
  bool enabled = 1;
  repeated AppRelease releases = 2;
  // checked is the last check of GitHub, unix seconds; 0: none yet.
  int64 checked = 3;
  // error is the last check's, empty when it went well.
  string error = 4;
  // downloads under way now, of at most 16.
  uint32 downloads = 5;
}
message AppRelease {
  string app = 1;
  string tag = 2;
  bool prerelease = 3;
  int64 bytes = 4;
  uint32 files = 5;
  int64 verified = 6; // unix seconds
}
message SetAppMirrorRequest {
  bool enabled = 1;
}
message SetAppMirrorResponse {}
message SetDebugRequest {
  // seconds: how long the window stays open, up to a day; 0 closes it.
  int64 seconds = 1;
}
message SetDebugResponse {
  int64 until = 1; // unix seconds; 0: closed
}

message StartUpdateRequest {
  // "" or "latest": the latest release; else vX.Y.Z, newer than the node.
  string version = 1;
}
message StartUpdateResponse {
  UpdateStatus status = 1;
}
message GetUpdateStatusRequest {}
message GetUpdateStatusResponse {
  UpdateStatus status = 1;
  string installed = 2; // the node's version
  string latest = 3;    // the latest release rayd's checks saw; "" when none
  string remote = 4;    // "on" or "off": StartUpdate is taken
  string auto = 5;      // "off" or "patch"
  string window = 6;    // the auto update's window, "HH:MM-HH:MM" in the node's time
  string timezone = 7;  // the node's time zone now: abbreviation and offset ("CET +01:00", "UTC +00:00")
  // Releases whose update rolled back or broke on the way: the auto update
  // leaves them alone.
  repeated string held = 8;
  // The newest patch release of the installed minor version newer than
  // it, as rayd's checks saw it (the auto update's target): latest when
  // that is one; after a newer minor version, the one rayd found by asking
  // for the next patch numbers. "" when none, or not checked.
  string latest_patch = 9;
  // The relays in front of this node and their updates by the node's word
  // (spec/relay-update-remote-v1.md §8), by name. An older node sends none.
  // Not support's: relays are the perimeter's.
  repeated RelayUpdateStatus relays = 10 [(google.api.field_visibility).restriction = "ADMIN"];
}
// RelayUpdateStatus is a relay's update by the node's word: the relay's
// last report and the node's offer as one. Times are the node's clock,
// not the relay's, which may differ.
message RelayUpdateStatus {
  string name = 1;
  string version = 2; // what the relay last said it runs; "" never said
  // unknown (no report ever: an older relay, or its rayd relay does not
  // run), off (behind target, but root on the relay has not allowed it),
  // current (on target or newer, or nothing offered), waiting (its turn
  // has not come: another relay updates, or one before it has not passed),
  // offered (its turn: in its feed, no report on it yet), and as the relay
  // reported on update_id: requested, running, done, rolled_back, failed
  // (with reason no_word: an hour without a word after requested or
  // running, or the queue went past it with no word on the offer).
  // waiting and offered end: within the relays' turns, 30 minutes each.
  string state = 3;
  string target = 4;    // the version offered; "" none
  string update_id = 5; // the node's update it follows (UpdateStatus.id)
  string reason = 6;    // a code for the client to name (policy, download, signature, …); "" none
  string error = 7;     // short text for a person, redacted, at most 200 bytes
  int64 changed_at = 8; // unix seconds: when state became what it is
  int64 seen_at = 9;    // unix seconds: when the node last heard the relay at all (a feed, a report); 0 never
  bool remote = 10;     // the relay takes the node's word (root on it: rayctl update remote on)
}
// UpdateStatus is the last update by request, or the one under way.
message UpdateStatus {
  string id = 1;
  // idle, requested, running, done, rolled_back (it failed, the previous
  // version runs), failed (refused, failed without a rollback, or
  // interrupted: no outcome within an hour).
  string state = 2;
  string from = 3;
  string to = 4;    // the version asked for ("latest" until it runs), then installed
  string by = 5 [(google.api.field_visibility).restriction = "ADMIN"]; // "alice/phone (remote)" or "auto"
  string kind = 6;  // "remote" or "auto"
  // Not support's: an error's text, as a loop's (integrations-v1 §2.3).
  string error = 7 [(google.api.field_visibility).restriction = "ADMIN"];
  int64 requested_at = 8; // unix seconds; 0: not yet
  int64 started_at = 9;
  int64 ended_at = 10;
  string target = 11; // the version asked for: "latest" or vX.Y.Z
  string release = 12; // the release the update went for, once known (vX.Y.Z)
}
