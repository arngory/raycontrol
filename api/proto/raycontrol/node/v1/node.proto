syntax = "proto3";

// Node API of raycontrol: on the local unix socket for rayctl, and on the
// remote API behind SPA and mTLS for admin devices (R3-3,
// docs/spec/api-v1.md).
// Compatibility follows protobuf rules; breaking changes go to node.v2.
package raycontrol.node.v1;

option go_package = "github.com/arngory/raycontrol/internal/gen/raycontrol/node/v1;nodev1";

service NodeService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc SetUserEnabled(SetUserEnabledRequest) returns (SetUserEnabledResponse);
  rpc SetUserServices(SetUserServicesRequest) returns (SetUserServicesResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // ExportUser returns a user's profiles: the links of their subscription
  // (docs/spec/subscription-v1.md §4), each with the next one while a
  // switch is pending (P-10). They hold the user's credentials, so the
  // call is audited. They work only from an address SPA has opened.
  rpc ExportUser(ExportUserRequest) returns (ExportUserResponse);

  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
  rpc SetServiceEnabled(SetServiceEnabledRequest) returns (SetServiceEnabledResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  // RotateService asks for the next key switch of a REALITY service
  // (docs/08-decisions.md, R4-7): a lead time away, so that clients get the
  // next keys first, or at once (leaked keys, a blocked name).
  rpc RotateService(RotateServiceRequest) returns (RotateServiceResponse);
  // SetServiceOption changes one of the few settings that may change after
  // creation: a site's answer, whether REALITY moves its server name,
  // Hysteria2's Brutal ceilings, Yggdrasil's public peers.
  rpc SetServiceOption(SetServiceOptionRequest) returns (SetServiceOptionResponse);

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // CreateDevice returns the device bundle with the device key. The key is
  // not stored anywhere it can be read back through the API.
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  // RevokeDevice revokes a device, or withdraws an unused invite.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // CreateInvite returns a one-time invite ("rcinv1:..."): the client
  // registers the device itself through the remote API (R3-3).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // Admin access: addresses (CIDR) that reach SSH without SPA (emergency
  // access, docs/08-decisions.md D-6).
  rpc GetAdminAccess(GetAdminAccessRequest) returns (GetAdminAccessResponse);
  rpc SetAdminAccess(SetAdminAccessRequest) returns (SetAdminAccessResponse);

  // The DNS provider (Cloudflare): the node's records in its zone and
  // certificates through DNS-01 with a wildcard name (R4-10). The token is
  // stored by rayd and never returned.
  rpc SetDNSProvider(SetDNSProviderRequest) returns (SetDNSProviderResponse);
  rpc GetDNS(GetDNSRequest) returns (GetDNSResponse);
  rpc SyncDNS(SyncDNSRequest) returns (SyncDNSResponse);
  rpc RemoveDNS(RemoveDNSRequest) returns (RemoveDNSResponse);

  // Backup returns a consistent copy of the node's database. Root only: it
  // holds every key (R4-13); rayctl encrypts it with the operator's
  // passphrase, which never reaches rayd.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // GetMetrics returns aggregate metrics in the Prometheus text format, no
  // names of users, devices or services (R4-14).
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

  // GetSummary returns the state of the client summaries (R4-21): whether
  // the node takes reports, the AS lookup, and the networks with at least
  // k reports; smaller groups only as a total.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  // SetSummary turns the reports on or off, and the online AS lookup. The
  // token is stored by rayd and never returned.
  rpc SetSummary(SetSummaryRequest) returns (SetSummaryResponse);

  // GetDeployment returns what root must install for the current services:
  // system users, unit files and other files. rayctl apply writes them.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
}

message SetDNSProviderRequest {
  string provider = 1; // cloudflare
  string token = 2;    // API token: Zone.DNS:Edit and Zone.Zone:Read on the node's zone
}
message SetDNSProviderResponse { DNSStatus status = 1; }

message GetDNSRequest {}
message GetDNSResponse { DNSStatus status = 1; }

message SyncDNSRequest {}
message SyncDNSResponse { DNSStatus status = 1; }

message RemoveDNSRequest {
  bool keep_records = 1; // forget the provider but leave the records in the zone
}
message RemoveDNSResponse { repeated string removed = 1; }

message DNSStatus {
  string provider = 1; // "" when the node has none
  string zone = 2;
  repeated DNSRecord records = 3; // what the node needs in the zone
  repeated string changes = 4;    // what a sync changed
  repeated string problems = 5;   // conflicts, records that cannot be made
}

message DNSRecord {
  string type = 1;
  string name = 2;
  string content = 3;
}

message BackupRequest {}
message BackupResponse {
  bytes database = 1;
  string node_id = 2;
  string version = 3;
  int64 created_at = 4;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  string text = 1;
}

message GetAdminAccessRequest {}
message GetAdminAccessResponse { repeated string cidrs = 1; }

message SetAdminAccessRequest { repeated string cidrs = 1; }
message SetAdminAccessResponse {}

message GetDeploymentRequest {}
message GetDeploymentResponse {
  repeated SystemUser users = 1;
  repeated DeployFile files = 2;
  repeated string units = 3;     // units to enable and keep running
  repeated string warnings = 4;
  // Ports clients reach; host firewalls (firewalld, ufw) must let them through.
  repeated PortRange host_ports = 5;
}

message PortRange {
  string proto = 1; // tcp | udp
  uint32 from = 2;
  uint32 to = 3;    // inclusive
}

message SystemUser {
  string name = 1;
  uint32 uid = 2;
  repeated string extra_groups = 3; // groups the user joins
}

message DeployFile {
  string path = 1;
  uint32 mode = 2;
  bytes content = 3;
}

message GetStatusRequest {}
message GetStatusResponse {
  string version = 1;
  string node_id = 2;
  string host = 3;
  uint32 users = 4;
  uint32 services = 5;
  uint32 active_devices = 6;
  // SPA ports open right now (previous, current and next slot).
  repeated uint32 spa_ports = 7;
}

message User {
  int64 id = 1;
  string name = 2;
  bool enabled = 3;
  int64 expires_at = 4;          // unix seconds, 0 = never
  int64 traffic_limit_bytes = 5; // 0 = unlimited
  string note = 6;
  int64 created_at = 7;
  repeated string services = 8;  // service names
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  string name = 1;
  int64 expires_at = 2;
  int64 traffic_limit_bytes = 3;
  string note = 4;
  repeated string services = 5;
}
message CreateUserResponse { User user = 1; }

message SetUserEnabledRequest {
  string name = 1;
  bool enabled = 2;
}
message SetUserEnabledResponse {}

message SetUserServicesRequest {
  string name = 1;
  repeated string services = 2;
}
message SetUserServicesResponse {}

message DeleteUserRequest { string name = 1; }
message DeleteUserResponse {}

message ExportUserRequest { string name = 1; }
message ExportUserResponse {
  repeated Profile profiles = 1;
}
// Profile is one profile of the subscription.
message Profile {
  uint32 service_id = 1;
  string service = 2;
  string link = 3;
  // next_link replaces link from next_from (unix seconds) on; empty when
  // nothing is pending.
  string next_link = 4;
  int64 next_from = 5;
}

message Service {
  uint32 id = 1; // also the SPA scope ID
  string kind = 2;
  string name = 3;
  bool enabled = 4;
  string settings_json = 5;
  int64 created_at = 6;
  uint32 uid = 7; // system user of the service's process, 0 if none
}

message ListServicesRequest {}
message ListServicesResponse {
  repeated Service services = 1;
  repeated string kinds = 2; // kinds this node can run
}

message CreateServiceRequest {
  string kind = 1;
  string name = 2;
  string settings_json = 3;
}
message CreateServiceResponse { Service service = 1; }

message SetServiceEnabledRequest {
  string name = 1;
  bool enabled = 2;
}
message SetServiceEnabledResponse {}

message DeleteServiceRequest { string name = 1; }
message DeleteServiceResponse {}

message SetServiceOptionRequest {
  string name = 1;
  string key = 2;
  string value = 3;
}
message SetServiceOptionResponse {
  Service service = 1;
}

message RotateServiceRequest {
  string name = 1;
  bool now = 2;
}
message RotateServiceResponse {
  int64 switch_at = 1; // unix seconds; later if a new server name waits for its certificate
}

message Device {
  string id = 1;
  string user = 2;
  string name = 3;
  string role = 4; // user | admin
  int64 created_at = 5;
  int64 revoked_at = 6; // 0 = active
  bool registered = 7; // through the remote API, with a client certificate
}

// Invite is an invite not yet used.
message Invite {
  string id = 1;
  string user = 2;
  string name = 3; // of the device it becomes
  string role = 4;
  int64 created_at = 5;
  int64 expires_at = 6;
}

message ListDevicesRequest { string user = 1; }
message ListDevicesResponse {
  repeated Device devices = 1;
  repeated Invite invites = 2;
}

message CreateDeviceRequest {
  string user = 1;
  string name = 2;
  string role = 3;
}
message CreateDeviceResponse {
  Device device = 1;
  string bundle = 2; // "rcdev1:..." (docs/spec/spa-v2.md)
}

message RevokeDeviceRequest { string id = 1; }
message RevokeDeviceResponse {}

message CreateInviteRequest {
  string user = 1;
  string name = 2; // of the device
  string role = 3; // user | admin
  int64 ttl_seconds = 4; // 0: a day; at most a week
}
message CreateInviteResponse {
  Invite invite = 1;
  string invite_code = 2; // "rcinv1:..." (docs/spec/api-v1.md)
}

message AuditEntry {
  int64 time = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string result = 5;
}

message ListAuditRequest { uint32 limit = 1; }
message ListAuditResponse { repeated AuditEntry entries = 1; }

message GetSummaryRequest {
  // days counted: 1 to 30, 7 when 0.
  uint32 days = 1;
}
message GetSummaryResponse {
  bool enabled = 1;
  // api is the online lookup turned on ("ipinfo"), or empty.
  string api = 2;
  // dbs are the AS databases in lookup order.
  repeated SummaryDB dbs = 3;
  repeated SummaryNetwork networks = 4;
  // other_reports come from networks with fewer than k reports.
  int64 other_reports = 5;
  uint32 days = 6;
  uint32 k = 7;
}
message SummaryDB {
  string role = 1; // operator | release
  string path = 2;
  bool present = 3;
  int64 built = 4; // unix seconds, from the file's metadata
  string type = 5;
}
message SummaryNetwork {
  uint32 asn = 1;
  string name = 2;
  string country = 3;
  int64 reports = 4;
  map<string, int64> nets = 5;
  repeated SummaryService services = 6;
}
message SummaryService {
  uint32 id = 1;
  string name = 2;
  map<string, int64> results = 3;
  map<string, int64> udp = 4;
  map<string, int64> mbps = 5;
  map<string, int64> stall_kib = 6;
}
message SetSummaryRequest {
  // enabled: "on" or "off"; empty leaves it.
  string enabled = 1;
  // api: "ipinfo" with a token turns the lookup on, "none" turns it off;
  // empty leaves it.
  string api = 2;
  string token = 3;
}
message SetSummaryResponse {}
