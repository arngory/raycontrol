// Subset of Xray-core API definitions (github.com/XTLS/Xray-core, MPL-2.0),
// pinned fork arngory/xray-core 88b1d7b (v26.10.31). Package names and field
// numbers must stay identical to Xray: they define the wire format and the
// gRPC method paths. Only what raycontrol calls is declared: the users'
// byte counters for the traffic limit (docs/spec/traffic-limit-v1.md §2.1).
syntax = "proto3";

package xray.app.stats.command;

option go_package = "github.com/arngory/raycontrol/internal/gen/xray/app/stats/command;command";

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

message SysStatsRequest {}

// SysStatsResponse: the uptime only (seconds since the stats service
// started, with the process); Xray sends memory figures too.
message SysStatsResponse {
  uint32 Uptime = 10;
}

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
  rpc GetSysStats(SysStatsRequest) returns (SysStatsResponse) {}
}
