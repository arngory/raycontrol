name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          ./scripts/gen.sh
          git diff --exit-code -- internal/gen
      - name: Shell scripts
        run: shellcheck scripts/*.sh install/*.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Built from source with the module's Go: prebuilt binaries made with an
      # older Go refuse to lint a go 1.26 module.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  perimeter:
    # Real nftables, NFLOG and TCP in a fresh network namespace.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y nftables
      - run: go test -c -o perimeter.test ./internal/perimeter
      - run: sudo RAYCONTROL_NETNS_TEST=1 unshare -n ./perimeter.test -test.run TestNetns -test.v

  xray:
    # The rendered inner stage on a real Xray from the pinned fork: config
    # check, users through the API, traffic through VLESS with ML-KEM-768.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache: false
      - name: Build Xray
        working-directory: xray
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/xray" ./main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: XRAY_BIN="$RUNNER_TEMP/xray" go test -count=1 -run TestInnerWithXray -v ./internal/xrayapi

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dist/ ./cmd/...
