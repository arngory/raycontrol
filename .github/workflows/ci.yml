name: CI

# One full run a commit (CONTRIBUTING.md): a pull request's head, and main's
# commit once merged. A push to a branch runs nothing by itself: its pull
# request does, or Run workflow by hand. The Release workflow takes main's
# green run of the commit it releases and runs this itself only without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels its run. Any other run is a group
# of its own and never waits or is cancelled: a release may take it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Known vulnerabilities reachable from our code, in the standard library of
  # the toolchain go.mod names and in the modules. v0.23.0 shipped on go1.26.0
  # with 37 of them reachable (HTTP/2 and TLS servers on public ports). The
  # Release workflow runs it again on the day it releases, whichever CI run
  # it takes, so a release cannot ship with one.
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          ./scripts/gen.sh
          git diff --exit-code -- internal/gen api/openapi
          # A file the generator writes and the commit lacks (a new or renamed one).
          test -z "$(git status --porcelain -- internal/gen api/openapi)" || { git status --short -- internal/gen api/openapi; exit 1; }
      - name: The proto only grows since the release it builds on
        # Additions only (integrations-v1 §10), buf's FILE rules (buf.yaml), against the newest release the commit
        # descends from: a backport to v0.33 against v0.33.x, not a later minor. Our API only: api/xray is Xray's,
        # trimmed by hand. The history without trees or files is a few MB; git archive fetches what it reads.
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow --filter=tree:0 --tags origin
          else
            git fetch --quiet --tags origin
          fi
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD)
          against="$RUNNER_TEMP/proto-$tag"
          mkdir -p "$against"
          git archive "$tag" buf.yaml api | tar -x -C "$against"
          .bin/buf breaking api/proto --against "$against/api/proto"
      - name: Shell scripts
        run: shellcheck -x scripts/*.sh install/*.sh test/install/*.sh test/supervise/*.sh test/relay/*.sh test/dns53/*.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # rayspa's unit at boot (R4-40): no ordering cycle with cloud-init, the
      # network managers, sshd and the host firewalls, by systemd-analyze
      # verify; here it fails instead of skipping without it.
      - name: rayspa's ordering at boot
        run: RAYCONTROL_REQUIRE_SYSTEMD_ANALYZE=1 go test -count=1 -run TestRayspaNoOrderingCycle -v ./internal/deploy
      # Built from source with the module's Go: prebuilt binaries made with an
      # older Go refuse to lint a go 1.27 module, and v2.5.0 could not read
      # Go 1.27's export data.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  perimeter:
    # Real nftables, NFLOG and TCP in a fresh network namespace.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y nftables
      - run: go test -c -o perimeter.test ./internal/perimeter
      - run: sudo RAYCONTROL_NETNS_TEST=1 unshare -n ./perimeter.test -test.run TestNetns -test.v
      # A relay in the kernel between three namespaces (relay-v1 §3.1).
      - run: sudo test/relay/run.sh ./perimeter.test
      # The same with the real parts: the exit's feed, rayspa -relay and
      # rayd relay (the relay's probe endpoint, relay-v1 §9), and the
      # exit's word on the relay's updates (relay-update-remote-v1 §12.2):
      # rayd a release build, as rayd relay takes offers only then, and
      # against v0.26.0's rayd relay and exit (its api.test).
      - run: >-
          go test -c -o api.test ./internal/api && go build -o rayspa ./cmd/rayspa &&
          go build -ldflags "-X main.version=v0.90.0" -o rayd ./cmd/rayd
      - run: test/relay/previous.sh old v0.26.0
      - run: sudo test/relay/e2e.sh ./api.test ./rayspa ./rayd old/api.test old/rayd
      # rayd credential as root, the runtime directory a mount of its own as
      # in the unit's mount namespace; the reserved ports in a network
      # namespace of their own (the test job runs them unprivileged).
      - run: go test -c -o deploy.test ./internal/deploy
      - run: sudo ./deploy.test -test.run 'TestCopyCredential|TestOpenBeneath|TestReservedPortsNetns' -test.v

  xray:
    # The rendered inner stage, REALITY and Hysteria2 on a real Xray from the
    # pinned fork, REALITY, DoH and naive behind the pinned niko-server front.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # One Go for everything we ship: the go line of our go.mod (setup-go
          # reads that line alone, so go.mod has no toolchain line), not
          # whatever 1.27.x is newest when the job runs; GOTOOLCHAIN=local
          # below refuses rather than fetch another Go if the fork asks for a
          # newer one.
          go-version-file: go.mod
          cache: false
      - name: Build Xray
        working-directory: xray
        env:
          GOTOOLCHAIN: local
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/xray" ./main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The pinned niko-server release: REALITY, DoH and naive through its
      # front on TCP 443 (tcpmux, R2-15).
      - run: scripts/niko-server.sh amd64 "$RUNNER_TEMP/niko-server"
      # slipstream: the pinned server release, and the fork's client at its
      # pinned commit for the end-to-end test.
      - run: scripts/slipstream-server.sh amd64 "$RUNNER_TEMP/slipstream-server"
      - name: Slipstream client commit
        id: slipclient
        run: . deploy/versions.env && echo "commit=$SLIPSTREAM_CLIENT_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: slipcache
        with:
          path: ${{ runner.temp }}/slipstream-client
          key: slipstream-client-${{ steps.slipclient.outputs.commit }}-ubuntu-24.04
      - name: Build the slipstream client
        if: steps.slipcache.outputs.cache-hit != 'true'
        run: |
          . deploy/versions.env
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libssl-dev ninja-build meson
          git clone -q "$SLIPSTREAM_SERVER_REPOSITORY" slipstream-src
          git -C slipstream-src checkout -q "$SLIPSTREAM_CLIENT_COMMIT"
          git -C slipstream-src submodule update -q --init --recursive
          (cd slipstream-src && meson setup --buildtype=release --warnlevel=0 build >/dev/null && ninja -C build slipstream-client >/dev/null)
          install -m 0755 slipstream-src/build/slipstream-client "$RUNNER_TEMP/slipstream-client"
      # A supervised node (rayd serve -supervise) takes port 443 as a node does.
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: >-
          XRAY_BIN="$RUNNER_TEMP/xray" NIKO_SERVER_BIN="$RUNNER_TEMP/niko-server"
          SLIPSTREAM_SERVER_BIN="$RUNNER_TEMP/slipstream-server" SLIPSTREAM_CLIENT_BIN="$RUNNER_TEMP/slipstream-client"
          go test -count=1 -run 'WithXray|WithNikoServer|ThroughXray|Supervised' -v ./internal/xrayapi
      # The DNS front beside the runner's own systemd-resolved: they share
      # UDP 53 (niko-server v0.8.2), the stub binds again when resolved
      # restarts beside the front.
      - run: sudo test/dns53/resolved.sh "$RUNNER_TEMP/niko-server"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray
          path: ${{ runner.temp }}/xray
          retention-days: 3

  acme:
    # Certificates from Pebble, Let's Encrypt's test CA: through HTTP-01, and
    # a wildcard through DNS-01; pebble-challtestsrv resolves every name to
    # 127.0.0.1 and serves the TXT records.
    runs-on: ubuntu-24.04
    env:
      PEBBLE: github.com/letsencrypt/pebble/v2@v2.10.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Start Pebble
        run: |
          go install "${PEBBLE%@*}/cmd/pebble@${PEBBLE#*@}" "${PEBBLE%@*}/cmd/pebble-challtestsrv@${PEBBLE#*@}"
          bin="$(go env GOPATH)/bin"
          dir="$(cd /tmp && go mod download -json "$PEBBLE" | jq -r .Dir)"
          "$bin/pebble-challtestsrv" -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" -doh "" &
          (cd "$dir" && PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 "$bin/pebble" -dnsserver 127.0.0.1:8053 &)
          for i in $(seq 30); do curl -skf https://127.0.0.1:14000/dir > /dev/null && exit 0; sleep 1; done
          exit 1
      # Pebble's root goes in as a private CA's does on a node: the extra
      # file of the node's roots (internal/roots), not the system store.
      - run: |
          dir="$(cd /tmp && go mod download -json "$PEBBLE" | jq -r .Dir)"
          PEBBLE_DIRECTORY=https://127.0.0.1:14000/dir PEBBLE_ROOT="$dir/test/certs/pebble.minica.pem" \
            go test -count=1 -run 'TestIssue.*WithPebble' -v ./internal/certs

  bootstrap:
    # The signature checks of install/bootstrap.sh (openssl) and of rayctl
    # update (Go) against signatures made by minisign itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: .github/scripts/apt-install.sh minisign
      - run: test/install/minisig.sh

  install:
    # A whole install through bootstrap.sh in a systemd container per system
    # (docs/decisions.md, R2-1), with each family's usual host firewall,
    # checked from a second container like a client: SPA over UDP and TCP,
    # the subscription, revocation, firewall reloads, flush ruleset, reboot.
    # On debian13 first an install with the default services (REALITY
    # alone), before and after its site's certificate, and its uninstall.
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian12, debian13, ubuntu2404, rocky9, rocky10]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: |
          for c in rayd rayspa rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
          # The test AS database for the hints of the client summaries.
          go run ./test/install/asndb -o bin/asn-test.mmdb 0.0.0.0/0
          # Holds port 443 for the refusal of the host check.
          CGO_ENABLED=0 go build -o bin/listen ./test/install/listen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xray
          path: bin
      - name: niko-server and slipstream-server releases
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          scripts/slipstream-server.sh amd64 bin/slipstream-server
          chmod +x bin/*
      - name: Bootstrap dependencies on the bare image
        run: test/install/deps.sh ${{ matrix.distro }}
      - name: Prepare the systemd image
        run: test/install/prepare.sh ${{ matrix.distro }}
      - name: Install and probe
        run: test/install/run.sh ${{ matrix.distro }} bin

  upgrade:
    # The update from the latest release, by its own rayctl, to this build
    # (test/install/upgrade.sh): the node it gives must be the one a fresh
    # install of this build gives, subscription included. And from the
    # oldest release bootstrap.sh installs (MIN_VERSION) along the path
    # docs/RELEASE.md gives it: its rayctl takes no archive with names it
    # does not know (before v0.15.0), so v0.15.0 first, then the latest
    # release, each verified and extracted by the rayctl on the node as
    # from GitHub, then this build. Only the latest release was tested
    # before, with -local, which skips the archive: "unexpected
    # slipstream-server" on a v0.10 node went unseen.
    name: upgrade (${{ matrix.from }})
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: latest
          - from: v0.10.2
            step: v0.15.0
          # The handoff (docs/RELEASE.md): this tree as v0.0.1 updates to
          # itself as a signed v0.0.2, by v0.0.2's own rayctl.
          - from: handoff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: for c in rayd rayspa rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xray
          path: bin
      - name: niko-server and slipstream-server releases
        # Both, as the archive carries both: a fresh install without
        # slipstream-server differed from a node updated from v0.16.0, which
        # has it (every run after v0.16.0 was out).
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          scripts/slipstream-server.sh amd64 bin/slipstream-server
          chmod +x bin/*
      - name: The release to update from
        if: matrix.from != 'handoff'
        run: test/install/previous.sh old "${{ matrix.from }}"
      - name: The stepping-stone release, then the latest
        if: matrix.step != ''
        run: |
          test/install/previous.sh step-bin "${{ matrix.step }}" step/1
          test/install/previous.sh latest-bin latest step/2
      - name: Bootstrap dependencies on the bare image
        run: test/install/deps.sh debian13
      - name: Prepare the systemd image
        run: test/install/prepare.sh debian13
      - name: Update and compare with a fresh install
        if: matrix.from != 'handoff'
        run: test/install/upgrade.sh debian13 bin old ${{ matrix.step && 'step' || '' }}
      - name: The handoff's two builds and signed release
        if: matrix.from == 'handoff'
        run: |
          .github/scripts/apt-install.sh minisign
          test/install/handoff-release.sh bin hand
      - name: Update by the release's own rayctl and compare with a fresh install
        if: matrix.from == 'handoff'
        run: |
          TEST_RELEASE_KEY="$(cat hand/key.pub)" EXPECT_HANDOFF=1 STEPS_ONLY=1 \
            test/install/upgrade.sh debian13 hand/new hand/old hand/step

  relay-host:
    # A relay updated by its exit's word on systemd hosts
    # (test/relay/host.sh, relay-update-remote-v1 §12.2): an exit and a
    # relay (bootstrap.sh -relay) in containers, this tree as test
    # releases signed with a throwaway key on a local mirror. The exit's
    # update names its release to the relay, which takes it once root
    # turns remote on and forwards after; and back from a rayspa that
    # does not run, the exit away, a kill -9, systemctl stop and a power
    # cut halfway; another signed release refused; remote off.
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xray
          path: bin
      - name: niko-server and slipstream-server releases
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          scripts/slipstream-server.sh amd64 bin/slipstream-server
          chmod +x bin/*
      - run: .github/scripts/apt-install.sh minisign
      - name: Prepare the systemd image
        run: test/install/prepare.sh debian13
      - name: The relay's update by its exit's word
        run: test/relay/host.sh bin

  supervise:
    # A node without systemd (rayd serve -supervise) in a plain container,
    # probed from a second one: the recipe for a client's CI.
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: for c in rayd rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xray
          path: bin
      - name: niko-server release
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          chmod +x bin/*
      - run: test/supervise/run.sh bin debian:13

  rayctl:
    # rayctl for the administrator's own machine: macOS and FreeBSD, built
    # from Linux as the Release workflow builds them (docs/research/platforms-and-hosts.md, §2). The node
    # stays Linux; what is Linux's alone sits in *_linux.go, and this job is
    # what keeps the other files building. Nothing runs here: the tests are
    # vetted, compiled and linked, not run (-exec true). On FreeBSD only
    # rayctl's own: internal/api's tests name unix.Ucred, which x/sys has
    # for Linux and macOS.
    name: rayctl (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64, tests: imports}
          - {goos: darwin, goarch: amd64, tests: imports}
          - {goos: freebsd, goarch: amd64, tests: own}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dist/rayctl ./cmd/rayctl
          file dist/rayctl
      - name: Vet and compile the tests
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TESTS: ${{ matrix.tests }}
        run: |
          pkgs=(./cmd/rayctl)
          if [ "$TESTS" = imports ]; then
            mapfile -t pkgs < <(go list -deps ./cmd/rayctl | grep '^github.com/arngory/raycontrol')
          fi
          go vet "${pkgs[@]}"
          go test -count=1 -run '^$' -exec true "${pkgs[@]}"

  build:
    # The release archive as the Release workflow makes it, without the
    # signature: raycontrol, niko-server checked against the pinned hashes,
    # Xray from the pinned fork, VERSIONS.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dist/ ./cmd/...
      - name: niko-server
        run: scripts/niko-server.sh ${{ matrix.goarch }} dist/niko-server
      - name: slipstream-server
        run: scripts/slipstream-server.sh ${{ matrix.goarch }} dist/slipstream-server
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # One Go for everything we ship: the go line of our go.mod (setup-go
          # reads that line alone, so go.mod has no toolchain line), not
          # whatever 1.27.x is newest when the job runs; GOTOOLCHAIN=local
          # below refuses rather than fetch another Go if the fork asks for a
          # newer one.
          go-version-file: go.mod
      - name: Build Xray
        working-directory: xray
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -buildid=" -o ../dist/xray ./main
      - name: Archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          . deploy/versions.env
          {
            echo "raycontrol ${GITHUB_SHA}"
            echo "xray ${XRAY_REPOSITORY} ${XRAY_COMMIT}"
            echo "niko-server ${NIKO_SERVER_TAG} ${NIKO_SERVER_REPOSITORY} ${NIKO_SERVER_COMMIT}"
            echo "slipstream-server ${SLIPSTREAM_SERVER_TAG} ${SLIPSTREAM_SERVER_REPOSITORY} ${SLIPSTREAM_SERVER_COMMIT}"
          } > dist/VERSIONS
          tar -czf "raycontrol-linux-${GOARCH}.tar.gz" -C dist rayd rayspa rayctl xray niko-server slipstream-server VERSIONS
          tar -tzvf "raycontrol-linux-${GOARCH}.tar.gz"
          file dist/xray dist/niko-server dist/slipstream-server dist/rayd

  # The one check the ruleset on main asks of CI: green when every job above
  # passed, whatever the matrix becomes.
  result:
    name: CI result
    if: always()
    needs: [govulncheck, test, perimeter, xray, acme, bootstrap, install, upgrade, relay-host, supervise, rayctl, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "a job ended $r: $RESULTS"; exit 1 ;; esac
          done
          echo "all jobs: $RESULTS"
