name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # The Release workflow runs all of it on the commit it releases.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          ./scripts/gen.sh
          git diff --exit-code -- internal/gen
      - name: Shell scripts
        run: shellcheck -x scripts/*.sh install/*.sh test/install/*.sh test/supervise/*.sh test/relay/*.sh test/dns53/*.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Built from source with the module's Go: prebuilt binaries made with an
      # older Go refuse to lint a go 1.26 module.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  perimeter:
    # Real nftables, NFLOG and TCP in a fresh network namespace.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y nftables
      - run: go test -c -o perimeter.test ./internal/perimeter
      - run: sudo RAYCONTROL_NETNS_TEST=1 unshare -n ./perimeter.test -test.run TestNetns -test.v
      # A relay in the kernel between three namespaces (relay-v1 §3.1).
      - run: sudo test/relay/run.sh ./perimeter.test
      # The same with the real parts: the exit's feed, rayspa -relay and
      # rayd relay (the relay's probe endpoint, relay-v1 §9).
      - run: go test -c -o api.test ./internal/api && go build -o rayspa ./cmd/rayspa && go build -o rayd ./cmd/rayd
      - run: sudo test/relay/e2e.sh ./api.test ./rayspa ./rayd

  xray:
    # The rendered inner stage, REALITY and Hysteria2 on a real Xray from the
    # pinned fork, REALITY, DoH and naive behind the pinned niko-server front.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache: false
      - name: Build Xray
        working-directory: xray
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/xray" ./main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The pinned niko-server release: REALITY, DoH and naive through its
      # front on TCP 443 (tcpmux, R2-15).
      - run: scripts/niko-server.sh amd64 "$RUNNER_TEMP/niko-server"
      # slipstream: the pinned server release, and the fork's client at its
      # pinned commit for the end-to-end test.
      - run: scripts/slipstream-server.sh amd64 "$RUNNER_TEMP/slipstream-server"
      - name: Slipstream client commit
        id: slipclient
        run: . deploy/versions.env && echo "commit=$SLIPSTREAM_CLIENT_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: slipcache
        with:
          path: ${{ runner.temp }}/slipstream-client
          key: slipstream-client-${{ steps.slipclient.outputs.commit }}-ubuntu-24.04
      - name: Build the slipstream client
        if: steps.slipcache.outputs.cache-hit != 'true'
        run: |
          . deploy/versions.env
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libssl-dev ninja-build meson
          git clone -q "$SLIPSTREAM_SERVER_REPOSITORY" slipstream-src
          git -C slipstream-src checkout -q "$SLIPSTREAM_CLIENT_COMMIT"
          git -C slipstream-src submodule update -q --init --recursive
          (cd slipstream-src && meson setup --buildtype=release --warnlevel=0 build >/dev/null && ninja -C build slipstream-client >/dev/null)
          install -m 0755 slipstream-src/build/slipstream-client "$RUNNER_TEMP/slipstream-client"
      # A supervised node (rayd serve -supervise) takes port 443 as a node does.
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: >-
          XRAY_BIN="$RUNNER_TEMP/xray" NIKO_SERVER_BIN="$RUNNER_TEMP/niko-server"
          SLIPSTREAM_SERVER_BIN="$RUNNER_TEMP/slipstream-server" SLIPSTREAM_CLIENT_BIN="$RUNNER_TEMP/slipstream-client"
          go test -count=1 -run 'WithXray|WithNikoServer|ThroughXray|Supervised' -v ./internal/xrayapi
      # The DNS front beside the runner's own systemd-resolved: they share
      # UDP 53 (niko-server v0.8.2), the stub binds again when resolved
      # restarts beside the front.
      - run: sudo test/dns53/resolved.sh "$RUNNER_TEMP/niko-server"
      - uses: actions/upload-artifact@v4
        with:
          name: xray
          path: ${{ runner.temp }}/xray
          retention-days: 3

  acme:
    # Certificates from Pebble, Let's Encrypt's test CA: through HTTP-01, and
    # a wildcard through DNS-01; pebble-challtestsrv resolves every name to
    # 127.0.0.1 and serves the TXT records.
    runs-on: ubuntu-24.04
    env:
      PEBBLE: github.com/letsencrypt/pebble/v2@v2.10.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Pebble
        run: |
          go install "${PEBBLE%@*}/cmd/pebble@${PEBBLE#*@}" "${PEBBLE%@*}/cmd/pebble-challtestsrv@${PEBBLE#*@}"
          bin="$(go env GOPATH)/bin"
          dir="$(cd /tmp && go mod download -json "$PEBBLE" | jq -r .Dir)"
          "$bin/pebble-challtestsrv" -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" -doh "" &
          (cd "$dir" && PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 "$bin/pebble" -dnsserver 127.0.0.1:8053 &)
          for i in $(seq 30); do curl -skf https://127.0.0.1:14000/dir > /dev/null && exit 0; sleep 1; done
          exit 1
      - run: PEBBLE_DIRECTORY=https://127.0.0.1:14000/dir go test -count=1 -run 'TestIssue.*WithPebble' -v ./internal/certs

  bootstrap:
    # The signature checks of install/bootstrap.sh (openssl) and of rayctl
    # update (Go) against signatures made by minisign itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y minisign
      - run: test/install/minisig.sh

  install:
    # A whole install through bootstrap.sh in a systemd container per system
    # (docs/08-decisions.md, R2-1), with each family's usual host firewall,
    # checked from a second container like a client: SPA over UDP and TCP,
    # the subscription, revocation, firewall reloads, flush ruleset, reboot.
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian12, debian13, ubuntu2404, rocky9, rocky10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: |
          for c in rayd rayspa rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
          # The test AS database for the hints of the client summaries.
          go run ./test/install/asndb -o bin/asn-test.mmdb 0.0.0.0/0
          # Holds port 443 for the refusal of the host check.
          CGO_ENABLED=0 go build -o bin/listen ./test/install/listen
      - uses: actions/download-artifact@v4
        with:
          name: xray
          path: bin
      - name: niko-server and slipstream-server releases
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          scripts/slipstream-server.sh amd64 bin/slipstream-server
          chmod +x bin/*
      - name: Bootstrap dependencies on the bare image
        run: test/install/deps.sh ${{ matrix.distro }}
      - name: Prepare the systemd image
        run: test/install/prepare.sh ${{ matrix.distro }}
      - name: Install and probe
        run: test/install/run.sh ${{ matrix.distro }} bin

  upgrade:
    # The update from the latest release, by its own rayctl, to this build
    # (test/install/upgrade.sh): the node it gives must be the one a fresh
    # install of this build gives, subscription included. And from the
    # oldest release bootstrap.sh installs (MIN_VERSION) along the path
    # docs/RELEASE.md gives it: its rayctl takes no archive with names it
    # does not know (before v0.15.0), so v0.15.0 first, then the latest
    # release, each verified and extracted by the rayctl on the node as
    # from GitHub, then this build. Only the latest release was tested
    # before, with -local, which skips the archive: "unexpected
    # slipstream-server" on a v0.10 node went unseen.
    name: upgrade (${{ matrix.from }})
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: latest
          - from: v0.10.2
            step: v0.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: for c in rayd rayspa rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
      - uses: actions/download-artifact@v4
        with:
          name: xray
          path: bin
      - name: niko-server and slipstream-server releases
        # Both, as the archive carries both: a fresh install without
        # slipstream-server differed from a node updated from v0.16.0, which
        # has it (every run after v0.16.0 was out).
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          scripts/slipstream-server.sh amd64 bin/slipstream-server
          chmod +x bin/*
      - name: The release to update from
        run: test/install/previous.sh old "${{ matrix.from }}"
      - name: The stepping-stone release, then the latest
        if: matrix.step != ''
        run: |
          test/install/previous.sh step-bin "${{ matrix.step }}" step/1
          test/install/previous.sh latest-bin latest step/2
      - name: Bootstrap dependencies on the bare image
        run: test/install/deps.sh debian13
      - name: Prepare the systemd image
        run: test/install/prepare.sh debian13
      - name: Update and compare with a fresh install
        run: test/install/upgrade.sh debian13 bin old ${{ matrix.step && 'step' || '' }}

  supervise:
    # A node without systemd (rayd serve -supervise) in a plain container,
    # probed from a second one: the recipe for a client's CI.
    needs: xray
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build raycontrol
        run: for c in rayd rayctl; do CGO_ENABLED=0 go build -trimpath -o bin/$c ./cmd/$c; done
      - uses: actions/download-artifact@v4
        with:
          name: xray
          path: bin
      - name: niko-server release
        run: |
          scripts/niko-server.sh amd64 bin/niko-server
          chmod +x bin/*
      - run: test/supervise/run.sh bin debian:13

  build:
    # The release archive as the Release workflow makes it, without the
    # signature: raycontrol, niko-server checked against the pinned hashes,
    # Xray from the pinned fork, VERSIONS.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dist/ ./cmd/...
      - name: niko-server
        run: scripts/niko-server.sh ${{ matrix.goarch }} dist/niko-server
      - name: slipstream-server
        run: scripts/slipstream-server.sh ${{ matrix.goarch }} dist/slipstream-server
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
      - name: Build Xray
        working-directory: xray
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -buildid=" -o ../dist/xray ./main
      - name: Archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          . deploy/versions.env
          {
            echo "raycontrol ${GITHUB_SHA}"
            echo "xray ${XRAY_REPOSITORY} ${XRAY_COMMIT}"
            echo "niko-server ${NIKO_SERVER_TAG} ${NIKO_SERVER_REPOSITORY} ${NIKO_SERVER_COMMIT}"
            echo "slipstream-server ${SLIPSTREAM_SERVER_TAG} ${SLIPSTREAM_SERVER_REPOSITORY} ${SLIPSTREAM_SERVER_COMMIT}"
          } > dist/VERSIONS
          tar -czf "raycontrol-linux-${GOARCH}.tar.gz" -C dist rayd rayspa rayctl xray niko-server slipstream-server VERSIONS
          tar -tzvf "raycontrol-linux-${GOARCH}.tar.gz"
          file dist/xray dist/niko-server dist/slipstream-server dist/rayd
