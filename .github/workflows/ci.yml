name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          ./scripts/gen.sh
          git diff --exit-code -- internal/gen
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Built from source with the module's Go: prebuilt binaries made with an
      # older Go refuse to lint a go 1.26 module.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dist/ ./cmd/...
