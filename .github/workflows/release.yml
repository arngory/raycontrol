name: Release

# Builds the binaries, signs SHA256SUMS with minisign and publishes a GitHub
# release with the notes from .github/release-notes/<tag>.md. Each archive
# carries the data plane as well: Xray built from the pinned commit of our
# fork and niko-server checked against the hashes pinned in
# deploy/versions.env, so one signature covers everything bootstrap installs. Runs on the
# owner's tag v* (the tag ruleset lets only the owner create one): made on
# the Releases page (Draft a new release, a new tag on main, Publish) or
# pushed with git. By hand (Actions -> Release -> Run workflow, the tag as
# input) it only runs again for a tag already on the commit it is run from
# (a publish that failed); job tag checks both before anything else.
# The archives also carry IPinfo Lite, the AS database of the client
# summaries (R4-21, CC BY-SA 4.0, attribution in NOTICE).
# Beside the node's archives, rayctl alone for the administrator's own
# machine (rayctl-darwin-*, rayctl-freebsd-*), in the same signed SHA256SUMS:
# a node and bootstrap.sh read their own line of it by name.
# Needs MINISIGN_SECRET_KEY in the environment release and IPINFO_TOKEN in
# release-data (docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  tag:
    # Before CI and the approvals, not after: the tag is there, on this
    # commit (only the owner creates v* tags), and no release of it with
    # files is yet. The Releases page publishes a release, empty, when it
    # makes the tag, and that became the latest bootstrap.sh installs
    # (v0.31.0: no archive until it was deleted). Such an empty release is
    # deleted here, seconds after it is made, the tag kept; this run
    # publishes the real one. Made as a pre-release it is never the latest
    # even for those seconds.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: The tag on this commit; an empty release of it out of the way
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha 2>/dev/null) || sha=
          if [ -z "$sha" ]; then
            echo "no tag $TAG: only the owner makes v* tags (the tag ruleset), on a commit of main:"
            echo "on the Releases page (Draft a new release, tag $TAG, target main, Publish) or with"
            echo "  git tag $TAG $GITHUB_SHA && git push origin $TAG"
            echo "and the release runs on it"
            exit 1
          fi
          [ "$sha" = "$GITHUB_SHA" ] || { echo "tag $TAG is on $sha, this run on $GITHUB_SHA"; exit 1; }
          # A published release of the tag (drafts have none): with files it
          # is out already; without, it is the Releases page's.
          rel=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '"\(.id) \(.assets | length)"' 2>/dev/null) || rel=
          if [ -n "$rel" ]; then
            read -r id files <<< "$rel"
            if [ "$files" != 0 ]; then
              echo "release $TAG is out already, with $files files"
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            echo "::notice::the empty release $TAG of the Releases page deleted, the tag kept: this run publishes $TAG"
          fi

  # The whole CI on the commit being released: nothing is published unless
  # it is green. v0.16.0 went out from a green pull request while CI on
  # main, run beside the release, was red. main's own run of ci.yml on this
  # commit (a push, so the workflow is this commit's) counts: one still
  # running is waited for, a green one is taken, and only without one does
  # job ci run it all again. rayctl started on a Mac is a workflow of its own
  # (macos.yml), not run here.
  ci-main:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
    outputs:
      green: ${{ steps.run.outputs.green }}
    steps:
      - name: main's CI run of this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=20"
          # A tag made right after the merge can come before main's run is
          # listed: five minutes for it to appear, then up to the job's
          # timeout for it to finish.
          none=0
          for _ in $(seq 1 220); do
            states=$(gh api "$runs" --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"') || states=
            if [ -z "$states" ]; then
              none=$((none + 1))
              [ "$none" -lt 10 ] || break
            elif grep -q ' completed success$' <<< "$states"; then
              echo "green: $(grep -m 1 ' completed success$' <<< "$states")"
              echo green=true >> "$GITHUB_OUTPUT"
              exit 0
            elif ! grep -qv ' completed ' <<< "$states"; then
              break
            fi
            sleep 30
          done
          echo "no green run of ci.yml on main for $GITHUB_SHA: ${states:-none}; job ci runs it"
          echo green=false >> "$GITHUB_OUTPUT"

  # Also when ci-main itself failed: the fallback is the whole CI.
  ci:
    needs: [tag, ci-main]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.ci-main.outputs.green != 'true' }}
    uses: ./.github/workflows/ci.yml

  # Known vulnerabilities on the day of the release, whichever CI run counts:
  # main's green run can be days older than a vulnerability published since.
  govulncheck:
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  asn:
    # One download for both archives.
    needs: tag
    runs-on: ubuntu-24.04
    # IPINFO_TOKEN lives in this environment, open to v* tags and main only
    # (docs/RELEASE.md): a workflow on any other branch cannot read it.
    environment: release-data
    steps:
      - name: IPinfo Lite
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          test -n "$IPINFO_TOKEN" || { echo "IPINFO_TOKEN is not set"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 5 -o ipinfo_lite.mmdb "https://ipinfo.io/data/ipinfo_lite.mmdb?token=${IPINFO_TOKEN}"
          # An MMDB ends with its metadata after this marker; anything
          # small or without it is an error page, not the database.
          test "$(stat -c %s ipinfo_lite.mmdb)" -gt 1000000
          tail -c 131072 ipinfo_lite.mmdb | grep -qa 'MaxMind.com'
          sha256sum ipinfo_lite.mmdb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipinfo-lite
          path: ipinfo_lite.mmdb

  build:
    needs: asn
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/ ./cmd/...
      - name: niko-server
        run: scripts/niko-server.sh ${{ matrix.goarch }} dist/niko-server
      - name: slipstream-server
        run: scripts/slipstream-server.sh ${{ matrix.goarch }} dist/slipstream-server
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # One Go for everything we ship: the go line of our go.mod (setup-go
          # reads that line alone, so go.mod has no toolchain line), not
          # whatever 1.27.x is newest when the job runs; GOTOOLCHAIN=local
          # below refuses rather than fetch another Go if the fork asks for a
          # newer one.
          go-version-file: go.mod
      - name: Build Xray
        working-directory: xray
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -buildid=" -o ../dist/xray ./main
      - name: One Go
        # The binaries built here, Xray's too, are built on the Go go.mod
        # names, not on an older Go a runner or setup-go happens to have,
        # nor on a newer one the fork's go.mod would fetch. niko-server and
        # slipstream-server come as released, checked by their hashes.
        run: |
          want=$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')
          for b in dist/rayd dist/rayctl dist/rayspa dist/xray; do
            got=$(go version "$b" | awk '{print $2}')
            [ "$got" = "$want" ] || { echo "$b built with $got, go.mod names $want"; exit 1; }
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipinfo-lite
          path: dist
      - name: Archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          . deploy/versions.env
          cp deploy/NOTICE dist/NOTICE
          {
            echo "raycontrol ${TAG} ${GITHUB_SHA}"
            echo "xray ${XRAY_REPOSITORY} ${XRAY_COMMIT}"
            echo "niko-server ${NIKO_SERVER_TAG} ${NIKO_SERVER_REPOSITORY} ${NIKO_SERVER_COMMIT}"
            echo "slipstream-server ${SLIPSTREAM_SERVER_TAG} ${SLIPSTREAM_SERVER_REPOSITORY} ${SLIPSTREAM_SERVER_COMMIT}"
            echo "ipinfo-lite $(sha256sum dist/ipinfo_lite.mmdb | cut -d' ' -f1) $(date -u +%Y-%m-%d)"
          } > dist/VERSIONS
          tar -czf "raycontrol-linux-${GOARCH}.tar.gz" -C dist rayd rayspa rayctl xray niko-server slipstream-server VERSIONS ipinfo_lite.mmdb NOTICE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raycontrol-${{ matrix.goarch }}
          path: raycontrol-linux-*.tar.gz

  rayctl:
    # rayctl for macOS and FreeBSD: the remote administration and the probe
    # from the administrator's own machine (docs/research/platforms-and-hosts.md, §2). Built here from
    # Linux, without cgo, as CI's rayctl job builds them in every run. Not
    # notarised by Apple and never run in this workflow.
    needs: tag
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: freebsd, goarch: amd64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o client/rayctl ./cmd/rayctl
          want=$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')
          got=$(go version client/rayctl | awk '{print $2}')
          [ "$got" = "$want" ] || { echo "rayctl built with $got, go.mod names $want"; exit 1; }
          file client/rayctl
          echo "raycontrol ${TAG} ${GITHUB_SHA}" > client/VERSIONS
          tar -czf "rayctl-${GOOS}-${GOARCH}.tar.gz" -C client rayctl VERSIONS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rayctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rayctl-*.tar.gz

  release:
    needs: [ci-main, ci, govulncheck, build, rayctl]
    # CI green either way: main's run taken (ci skipped) or ci's own.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.rayctl.result == 'success' &&
      needs.govulncheck.result == 'success' &&
      (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci-main.outputs.green == 'true')) }}
    runs-on: ubuntu-24.04
    # MINISIGN_SECRET_KEY lives in this environment: v* tags and main only,
    # and the owner approves each run (docs/RELEASE.md). A repository secret
    # would be readable by a workflow on any branch.
    environment: release
    # One publish at a time: two close together would both list the
    # releases before either is out, and both pass --latest. The one that
    # runs is not cancelled; GitHub keeps one waiting, so a third that
    # comes meanwhile cancels the waiting one, which is run again by hand.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # Every archive of a release, by name: one that is missing stops the
      # release at the checksums. The node's first; their names are frozen
      # (docs/RELEASE.md).
      ARCHIVES: >-
        raycontrol-linux-amd64.tar.gz raycontrol-linux-arm64.tar.gz
        rayctl-darwin-arm64.tar.gz rayctl-darwin-amd64.tar.gz rayctl-freebsd-amd64.tar.gz
      # The OpenAPI of the integrations' roles (integrations-v1 §5.1), from
      # api/openapi of the commit: in the signed SHA256SUMS beside the
      # archives (the updater looks up its archive's line only).
      DOCS: openapi-billing.yaml openapi-support.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: raycontrol-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rayctl-*
          merge-multiple: true
      - name: Release notes exist
        run: test -s ".github/release-notes/${TAG}.md"
      - name: The commit is on main
        # The environment admits any v* tag, and a tag's workflow comes from
        # the tag's commit: a tag on a commit main does not hold would sign
        # what was never merged. The tag ruleset is what forbids such tags;
        # this catches the mistake.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "commit ${GITHUB_SHA} is not on main ($status)"; exit 1 ;;
          esac
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set"; exit 1; }
          .github/scripts/apt-install.sh minisign
          read -ra archives <<< "$ARCHIVES"
          read -ra docs <<< "$DOCS"
          for d in "${docs[@]}"; do
            role=${d#openapi-}
            cp "api/openapi/${role%.yaml}.openapi.yaml" "$d"
          done
          sha256sum "${archives[@]}" "${docs[@]}" > SHA256SUMS
          cat SHA256SUMS
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key" "$key.in" "$key.pub"' EXIT
          # The secret is raycontrol.key whole: its comment line and its key
          # line. The key line alone, as it is easily pasted, is taken too;
          # CRs, trailing blanks and empty lines go.
          printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' -e '/^$/d' > "$key.in"
          lines=$(wc -l < "$key.in")
          if [ "$lines" -eq 1 ] && ! grep -q '^untrusted comment:' "$key.in"; then
            { echo "untrusted comment: minisign secret key"; cat "$key.in"; } > "$key"
          else
            cp "$key.in" "$key"
          fi
          # Sign only with the key whose public half bootstrap.sh and rayctl
          # pin: a release signed with another one no node would take.
          pinned=$(sed -n 's/^const PubKey = "\(RW[A-Za-z0-9+/]*\)"$/\1/p' internal/release/release.go)
          test -n "$pinned" || { echo "no pinned public key in internal/release/release.go"; exit 1; }
          if ! minisign -R -s "$key" -p "$key.pub" < /dev/null > /dev/null 2>&1; then
            echo "MINISIGN_SECRET_KEY is not a minisign secret key without a password ($lines line(s) after trimming; want raycontrol.key whole, its comment line and its key line)"
            exit 1
          fi
          if [ "$(sed -n 2p "$key.pub")" != "$pinned" ]; then
            echo "MINISIGN_SECRET_KEY is another key than the one bootstrap.sh and rayctl pin ($pinned): nothing signed"
            exit 1
          fi
          minisign -S -s "$key" -m SHA256SUMS -t "raycontrol ${TAG}" < /dev/null
          minisign -Vm SHA256SUMS -P "$pinned"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -ra archives <<< "$ARCHIVES"
          read -ra docs <<< "$DOCS"
          # "Latest" only for the highest version: GitHub marks every new
          # release latest unless told otherwise, so a backport (v0.25.5
          # after v0.26.1) would point bootstrap.sh and the nodes' checks
          # at an older release. The published releases, drafts and
          # pre-releases left out, vX.Y.Z tags only, with this tag; the
          # listing must succeed, or nothing is published.
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name')
          highest=$({ printf '%s\n' "$TAG"; printf '%s\n' "$tags"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=--latest=false
          [ "$highest" = "$TAG" ] && latest=--latest
          echo "highest release ${highest}: ${TAG} published with ${latest}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "raycontrol ${TAG}" "$latest" \
            --notes-file ".github/release-notes/${TAG}.md" \
            "${archives[@]}" "${docs[@]}" SHA256SUMS SHA256SUMS.minisig
