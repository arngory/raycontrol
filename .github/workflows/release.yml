name: Release

# Builds the binaries, signs SHA256SUMS with minisign and publishes a GitHub
# release with the notes from .github/release-notes/<tag>.md. Each archive
# carries the data plane as well: Xray built from the pinned commit of our
# fork and niko-server checked against the hashes pinned in
# deploy/versions.env, so one signature covers everything bootstrap installs. Runs on a pushed
# tag v*, or by hand (Actions -> Release -> Run workflow) with the tag as input:
# the release then creates the tag on the commit it was run from.
# The archives also carry IPinfo Lite, the AS database of the client
# summaries (R4-21, CC BY-SA 4.0, attribution in NOTICE).
# Needs the repository secrets MINISIGN_SECRET_KEY and IPINFO_TOKEN
# (docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  ci:
    # The whole CI on the commit being released: nothing is published unless
    # it is green. v0.16.0 went out from a green pull request while CI on
    # main, run beside the release, was red.
    uses: ./.github/workflows/ci.yml

  asn:
    # One download for both archives.
    runs-on: ubuntu-24.04
    steps:
      - name: IPinfo Lite
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          test -n "$IPINFO_TOKEN" || { echo "IPINFO_TOKEN is not set"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 5 -o ipinfo_lite.mmdb "https://ipinfo.io/data/ipinfo_lite.mmdb?token=${IPINFO_TOKEN}"
          # An MMDB ends with its metadata after this marker; anything
          # small or without it is an error page, not the database.
          test "$(stat -c %s ipinfo_lite.mmdb)" -gt 1000000
          tail -c 131072 ipinfo_lite.mmdb | grep -qa 'MaxMind.com'
          sha256sum ipinfo_lite.mmdb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipinfo-lite
          path: ipinfo_lite.mmdb

  build:
    needs: asn
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            [ "${{ github.event_name }}" = push ] || { echo "tag $TAG already exists"; exit 1; }
          fi
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/ ./cmd/...
          # The binaries are built on the toolchain go.mod names, not on an
          # older Go a runner or setup-go happens to have.
          want=$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')
          for b in dist/rayd dist/rayctl dist/rayspa; do
            got=$(go version "$b" | awk '{print $2}')
            [ "$got" = "$want" ] || { echo "$b built with $got, go.mod names $want"; exit 1; }
          done
      - name: niko-server
        run: scripts/niko-server.sh ${{ matrix.goarch }} dist/niko-server
      - name: slipstream-server
        run: scripts/slipstream-server.sh ${{ matrix.goarch }} dist/slipstream-server
      - name: Fetch Xray
        run: |
          . deploy/versions.env
          git clone --filter=blob:none "$XRAY_REPOSITORY" xray
          git -C xray checkout -q "$XRAY_COMMIT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: xray/go.mod
      - name: Build Xray
        working-directory: xray
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -buildid=" -o ../dist/xray ./main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipinfo-lite
          path: dist
      - name: Archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          . deploy/versions.env
          cp deploy/NOTICE dist/NOTICE
          {
            echo "raycontrol ${TAG} ${GITHUB_SHA}"
            echo "xray ${XRAY_REPOSITORY} ${XRAY_COMMIT}"
            echo "niko-server ${NIKO_SERVER_TAG} ${NIKO_SERVER_REPOSITORY} ${NIKO_SERVER_COMMIT}"
            echo "slipstream-server ${SLIPSTREAM_SERVER_TAG} ${SLIPSTREAM_SERVER_REPOSITORY} ${SLIPSTREAM_SERVER_COMMIT}"
            echo "ipinfo-lite $(sha256sum dist/ipinfo_lite.mmdb | cut -d' ' -f1) $(date -u +%Y-%m-%d)"
          } > dist/VERSIONS
          tar -czf "raycontrol-linux-${GOARCH}.tar.gz" -C dist rayd rayspa rayctl xray niko-server slipstream-server VERSIONS ipinfo_lite.mmdb NOTICE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raycontrol-${{ matrix.goarch }}
          path: raycontrol-linux-*.tar.gz

  release:
    needs: [ci, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: raycontrol-*
          merge-multiple: true
      - name: Release notes exist
        run: test -s ".github/release-notes/${TAG}.md"
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set"; exit 1; }
          sudo apt-get install -y -q minisign
          sha256sum raycontrol-linux-*.tar.gz > SHA256SUMS
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "raycontrol ${TAG}"
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "raycontrol ${TAG}" \
            --notes-file ".github/release-notes/${TAG}.md" \
            raycontrol-linux-*.tar.gz SHA256SUMS SHA256SUMS.minisig
