name: Release

# A tag v* builds the binaries, signs SHA256SUMS with minisign and publishes
# a GitHub release with the notes from .github/release-notes/<tag>.md.
# Needs the repository secret MINISIGN_SECRET_KEY (docs/RELEASE.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/ ./cmd/...
          tar -czf "raycontrol-linux-${GOARCH}.tar.gz" -C dist rayd rayspa rayctl
      - uses: actions/upload-artifact@v4
        with:
          name: raycontrol-${{ matrix.goarch }}
          path: raycontrol-linux-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release notes exist
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set"; exit 1; }
          sudo apt-get install -y -q minisign
          sha256sum raycontrol-linux-*.tar.gz > SHA256SUMS
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "raycontrol ${GITHUB_REF_NAME}"
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "raycontrol ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            raycontrol-linux-*.tar.gz SHA256SUMS SHA256SUMS.minisig
