version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*flag.FlagSet).Parse
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (net.Listener).Close
        - (*github.com/arngory/raycontrol/internal/store.Store).Close
        - os.Remove
    gosec:
      excludes:
        - G104 # unchecked errors are errcheck's job, with its exclusions
        - G115 # integer conversions are bounds-checked where they matter
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
