version: v2
modules:
  - path: api/proto
    lint:
      use:
        - STANDARD
      # googleapis' own definition, kept as it is (spec/integrations-v1.md §5.1).
      ignore:
        - api/proto/google
    breaking:
      use:
        - FILE
  # Xray's own definitions: names follow Xray, not our lint rules.
  - path: api/xray
    lint:
      use:
        - MINIMAL
