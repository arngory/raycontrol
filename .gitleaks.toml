# gitleaks (checks.yml, job Secrets): its default rules on a pull request's commits. The check reads this file as
# main has it, so a change here is a pull request of its own and counts from the next one; gitleaks:allow comments
# are not taken.
#
# A false finding, say a test's throwaway key, goes to an allowlist here, with where the key comes from, for example:
#
# [[allowlists]]
# description = "the throwaway keys of a test, generated for it"
# paths = ['''^internal/[a-z]+/testdata/''']

title = "raycontrol"

[extend]
useDefault = true

# SPA test vectors (spa-v2 §5, spa-v3 §9): their device keys are fill bytes (0x11…, 0x55…) and every other key is
# derived from those for the vectors, nobody's key; clients check their code against them.
[[allowlists]]
description = "SPA test vectors: keys of fill bytes and derived from them"
paths = ['''^internal/spa/testdata/vectors(-v3)?\.json$''']
